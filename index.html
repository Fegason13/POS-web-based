<script type="text/babel">
const { useState, useEffect, useCallback, useMemo } = React;

// ── Supabase SQL schema (run once in your Supabase SQL editor) ──────────────
const SCHEMA_SQL = `
-- Branches (stores)
create table if not exists pos_branches (
  id uuid primary key default gen_random_uuid(),
  name text not null,
  address text,
  created_at timestamptz default now()
);

-- Categories (global)
create table if not exists pos_categories (
  id uuid primary key default gen_random_uuid(),
  name text not null,
  icon text default 'bi-cup-fill',
  sort_order int default 0,
  created_at timestamptz default now()
);

-- Products (per-branch)
create table if not exists pos_products (
  id uuid primary key default gen_random_uuid(),
  branch_id uuid references pos_branches(id) on delete cascade,
  category_id uuid references pos_categories(id) on delete set null,
  name text not null,
  price numeric(10,2) not null,
  description text,
  available boolean default true,
  created_at timestamptz default now()
);

-- Orders (per-branch)
create table if not exists pos_orders (
  id uuid primary key default gen_random_uuid(),
  branch_id uuid references pos_branches(id) on delete cascade,
  order_number serial,
  items jsonb not null,
  subtotal numeric(10,2) not null,

  discount numeric(10,2) default 0,
  total numeric(10,2) not null,
  payment_method text not null,
  status text default 'completed',
  note text,
  created_at timestamptz default now()
);

-- Expenses (per-branch cash going out)
create table if not exists pos_expenses (
  id uuid primary key default gen_random_uuid(),
  branch_id uuid references pos_branches(id) on delete cascade,
  amount numeric(10,2) not null,
  description text,
  created_at timestamptz default now()
);

-- Sample categories
insert into pos_categories (name, icon, sort_order) values
  ('Coffee', 'bi-cup-fill', 1), ('Tea', 'bi-cup-straw', 2), ('Pastries', 'bi-bag-fill', 3),
  ('Sandwiches', 'bi-basket3-fill', 4), ('Cold Drinks', 'bi-droplet-half', 5)
on conflict do nothing;

-- Disable row level security on all app tables so anon/public key can write through Supabase
alter table pos_branches disable row level security;
alter table pos_categories disable row level security;
alter table pos_products disable row level security;
alter table pos_orders disable row level security;
alter table pos_expenses disable row level security;
`;

// ── Config component ─────────────────────────────────────────────────────────
function ConfigScreen({ onConnect }) {
  const [url, setUrl] = useState(localStorage.getItem('sb_url') || '');
  const [key, setKey] = useState(localStorage.getItem('sb_key') || '');
  const [testing, setTesting] = useState(false);
  const [err, setErr] = useState('');
  const [copied, setCopied] = useState(false);

  const connect = async () => {
    if (!url || !key) { setErr('Both fields required'); return; }
    setTesting(true); setErr('');
    try {
      const client = supabase.createClient(url.trim(), key.trim());
      const checks = await Promise.all([
        client.from('pos_branches').select('id').limit(1),
        client.from('pos_categories').select('id').limit(1),
        client.from('pos_products').select('id').limit(1),
        client.from('pos_orders').select('id,branch_id').limit(1),
        client.from('pos_expenses').select('id,branch_id').limit(1),
      ]);
      const missing = checks.find(r => r.error);
      if (missing && missing.error.code === '42P01') {
        setErr('Tables not found — run the SQL schema first (see below)');
      } else if (missing && missing.error.code === '42703') {
        setErr('A required column is missing in the schema: ' + (missing.error.message || 'branch_id is missing on a table'));
      } else if (missing && /row-level security/i.test(missing.error.message || '') || missing && /policy/i.test(missing.error.message || '')) {
        setErr('RLS blocked the request: disable row level security on pos_branches or add a policy that allows anon/public inserts.');
      } else if (missing && missing.error.status === 401 || missing && /unauthorized/i.test(missing.error.message || '')) {
        setErr('Unauthorized: check your Supabase URL and anon/public key.');
      } else if (missing) {
        setErr('Connection check failed: ' + (missing.error.message || missing.error.details || 'unknown'));
      } else {
        localStorage.setItem('sb_url', url.trim());
        localStorage.setItem('sb_key', key.trim());
        onConnect(url.trim(), key.trim());
      }
    } catch (e) { setErr('Connection failed: ' + e.message); }
    setTesting(false);
  };

  const copySQL = () => {
    navigator.clipboard.writeText(SCHEMA_SQL);
    setCopied(true); setTimeout(() => setCopied(false), 2000);
  };

  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'2rem',background:'var(--bg)'}}>
      <div style={{width:'100%',maxWidth:520}}>
        <div style={{marginBottom:'2.5rem'}}>
          <div style={{fontSize:32,fontWeight:700,letterSpacing:'-1px',marginBottom:6}}>
            <i className="" style={{fontSize:20}}></i> Kape sa Harong
          </div>
          <div style={{color:'var(--text2)',fontSize:14}}>Connect your Supabase project to get started</div>
        </div>

        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:var_radius,padding:'1.5rem',marginBottom:'1rem'}}>
          <label style={{display:'block',fontSize:13,color:'var(--text2)',marginBottom:6}}>Supabase Project URL</label>
          <input value={url} onChange={e=>setUrl(e.target.value)}
            placeholder="https://xxxx.supabase.co"
            style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:8,padding:'10px 12px',color:'var(--text)',fontSize:14,marginBottom:'1rem'}} />
          <label style={{display:'block',fontSize:13,color:'var(--text2)',marginBottom:6}}>Anon/Public Key</label>
          <input value={key} onChange={e=>setKey(e.target.value)} type="password"
            placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
            style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:8,padding:'10px 12px',color:'var(--text)',fontSize:14}} />
          {err && <div style={{color:'var(--red)',fontSize:13,marginTop:10}}>{err}</div>}
          <button onClick={connect} disabled={testing}
            style={{width:'100%',marginTop:'1rem',background:'var(--amber)',color:'#1a0f00',padding:'12px',borderRadius:8,fontWeight:600,fontSize:15,opacity:testing?0.7:1}}>
            {testing ? 'Connecting…' : 'Connect →'}
          </button>
        </div>

        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:var_radius,padding:'1.5rem'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1rem'}}>
            <div style={{fontSize:13,fontWeight:600}}>Step 1 — Run this SQL in Supabase</div>
            <button onClick={copySQL} style={{background:'var(--bg3)',border:'1px solid var(--border2)',color:'var(--text2)',padding:'4px 10px',borderRadius:6,fontSize:12}}>
              {copied ? '✓ Copied' : 'Copy SQL'}
            </button>
          </div>
          <pre style={{fontFamily:'DM Mono',fontSize:11,color:'var(--text3)',overflowX:'auto',whiteSpace:'pre-wrap',lineHeight:1.6}}>
            {SCHEMA_SQL}
          </pre>
          <div style={{fontSize:12,color:'var(--text3)',marginTop:'0.75rem'}}>
            The button above copies the full schema, including branches and expenses. Run it in Supabase if you haven’t already.
            If writes still fail, check Supabase table policies: anon/public key needs insert/update/select permission on `pos_branches`, `pos_products`, `pos_orders`, and `pos_expenses`.
            If you see “new row violates row-level security policy for table `pos_branches`”, disable row-level security on `pos_branches` or add a policy that permits anon/public inserts.
            A 401 Unauthorized means the URL or anon/public key is invalid for this project.
            For a quick setup, you can also run <code>alter table pos_branches disable row level security;</code> in Supabase.
          </div>
        </div>
      </div>
    </div>
  );
}

function BranchSetupScreen({ onCreateBranch, saving, error }) {
  const [name, setName] = useState('');
  const [address, setAddress] = useState('');
  return (
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'2rem',background:'var(--bg)'}}>
      <div style={{width:'100%',maxWidth:520}}>
        <div style={{marginBottom:'2.5rem'}}>
          <div style={{fontSize:32,fontWeight:700,letterSpacing:'-1px',marginBottom:6}}>Create your first branch</div>
          <div style={{color:'var(--text2)',fontSize:14}}>A branch is required before you can use the POS dashboard.</div>
        </div>
        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:var_radius,padding:'1.5rem'}}>
          <label style={{display:'block',fontSize:13,color:'var(--text2)',marginBottom:6}}>Branch Name</label>
          <input value={name} onChange={e => setName(e.target.value)} placeholder="e.g. Main Store"
            style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:8,padding:'10px 12px',color:'var(--text)',fontSize:14,marginBottom:'1rem'}} />
          <label style={{display:'block',fontSize:13,color:'var(--text2)',marginBottom:6}}>Address (optional)</label>
          <input value={address} onChange={e => setAddress(e.target.value)} placeholder="Store address"
            style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:8,padding:'10px 12px',color:'var(--text)',fontSize:14,marginBottom:'1rem'}} />
          {error && <div style={{color:'var(--red)',fontSize:13,marginBottom:10}}>{error}</div>}
          <button onClick={() => onCreateBranch({ name: name.trim(), address: address.trim() })} disabled={saving || !name.trim()}
            style={{width:'100%',marginTop:'1rem',background:'var(--amber)',color:'#1a0f00',padding:'12px',borderRadius:8,fontWeight:600,fontSize:15,opacity:saving || !name.trim() ? 0.7 : 1}}>
            {saving ? 'Creating branch…' : 'Create branch'}
          </button>
        </div>
      </div>
    </div>
  );
}

const var_radius = 'var(--radius)';

// ── Main POS App ─────────────────────────────────────────────────────────────
function POSApp({ supabaseUrl, supabaseKey }) {
  const db = useMemo(() => supabase.createClient(supabaseUrl, supabaseKey), [supabaseUrl, supabaseKey]);
  const [tab, setTab] = useState('pos'); // pos | reports | products
  const [categories, setCategories] = useState([]);
  const [products, setProducts] = useState([]);
  const [orders, setOrders] = useState([]);
  const [branches, setBranches] = useState([]);
  const [currentBranch, setCurrentBranch] = useState(localStorage.getItem('pos_branch') || '');
  const [expenses, setExpenses] = useState([]);
  const [editingExpense, setEditingExpense] = useState(null);
  const [mobileNavOpen, setMobileNavOpen] = useState(false);
  const [expenseModalOpen, setExpenseModalOpen] = useState(false);
  const [editingOrder, setEditingOrder] = useState(null);
  const [orderModalOpen, setOrderModalOpen] = useState(false);
  const [activeCategory, setActiveCategory] = useState('all');
  const [search, setSearch] = useState('');
  const [cart, setCart] = useState([]);
  const [note, setNote] = useState('');
  const [paymentMethod, setPaymentMethod] = useState('cash');
  const [cashGiven, setCashGiven] = useState('');
  const [checkoutOpen, setCheckoutOpen] = useState(false);
  const [lastOrder, setLastOrder] = useState(null);
  const [receiptOpen, setReceiptOpen] = useState(false);
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState(null);
  const [lastDbError, setLastDbError] = useState(null);
  const [manualCashOnHand, setManualCashOnHand] = useState(() => {
    try {
      const stored = localStorage.getItem('manualCashOnHand');
      return stored !== null ? parseFloat(stored) : null;
    } catch (e) { return null; }
  });
  const [editingCashOnHand, setEditingCashOnHand] = useState(false);
  const [cashOnHandInput, setCashOnHandInput] = useState('');
  const [discounts, setDiscounts] = useState(() => {
    try {
      const raw = localStorage.getItem('pos_discounts');
      const parsed = raw ? JSON.parse(raw) : null;
      if (Array.isArray(parsed) && parsed.length) return parsed;
    } catch (e) {}
    return [
      { id: 't20', name: '20% off', percent: 20 },
      { id: 't15', name: '15% off', percent: 15 }
    ];
  });

  useEffect(() => {
    try {
      if (manualCashOnHand === null) localStorage.removeItem('manualCashOnHand');
      else localStorage.setItem('manualCashOnHand', manualCashOnHand.toString());
    } catch (e) {}
  }, [manualCashOnHand]);
  const [selectedDiscountId, setSelectedDiscountId] = useState('');
  const [discountModalOpen, setDiscountModalOpen] = useState(false);
  const [editingDiscount, setEditingDiscount] = useState(null);
  const [branchSetupSaving, setBranchSetupSaving] = useState(false);
  const [branchSetupError, setBranchSetupError] = useState('');
  const [printerDevice, setPrinterDevice] = useState(null);
  const [printerCharacteristic, setPrinterCharacteristic] = useState(null);
  const [printerConnecting, setPrinterConnecting] = useState(false);
  const [printerError, setPrinterError] = useState('');

  const CAFE_NAME = 'Kape sa Harong';
  const CAFE_ADDRESS = 'CAL Courtyard';
  const CAFE_TEL = '+63 912 345 6789';

  const showToast = (msg, type='success') => {
    setToast({msg,type});
    setTimeout(() => setToast(null), 2500);
  };

  const resetPrinter = () => {
    setPrinterDevice(null);
    setPrinterCharacteristic(null);
    setPrinterConnecting(false);
    setPrinterError('');
  };

  const disconnectPrinter = () => {
    try {
      if (printerDevice?.gatt?.connected) printerDevice.gatt.disconnect();
    } catch (e) {
      console.warn('Bluetooth disconnect failed', e);
    }
    resetPrinter();
    showToast('Bluetooth printer disconnected');
  };

  const connectPrinter = async () => {
    if (!navigator.bluetooth) {
      showToast('Bluetooth is not available in this browser', 'error');
      return;
    }
    setPrinterError('');
    setPrinterConnecting(true);
    try {
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: [
          '0000ffe0-0000-1000-8000-00805f9b34fb', // Most common 58mm BT printers (HM-10 style)
          '000018f0-0000-1000-8000-00805f9b34fb', // Alternative serial profile
          '00001101-0000-1000-8000-00805f9b34fb', // SPP (Serial Port Profile)
          'e7810a71-73ae-499d-8c15-faa9aef0c3f2', // PrinterShare / some 58mm models
          '49535343-fe7d-4ae5-8fa9-9fafd205e455', // ISSC BLE serial (common on 58mm)
          '0000ff00-0000-1000-8000-00805f9b34fb', // Generic FF00 service
        ]
      });
      device.addEventListener('gattserverdisconnected', () => {
        showToast('Bluetooth printer disconnected', 'error');
        resetPrinter();
      });
      const server = await device.gatt.connect();
      const serviceCandidates = [
        '0000ffe0-0000-1000-8000-00805f9b34fb',
        '000018f0-0000-1000-8000-00805f9b34fb',
        '00001101-0000-1000-8000-00805f9b34fb',
        'e7810a71-73ae-499d-8c15-faa9aef0c3f2',
        '49535343-fe7d-4ae5-8fa9-9fafd205e455',
        '0000ff00-0000-1000-8000-00805f9b34fb',
      ];
      let service = null;
      for (const sid of serviceCandidates) {
        try { service = await server.getPrimaryService(sid); break; } catch (err) {}
      }
      if (!service) {
        const services = await server.getPrimaryServices();
        if (services.length) service = services[0];
      }
      if (!service) throw new Error('No printer service found');
      const characteristicCandidates = [
        '0000ffe1-0000-1000-8000-00805f9b34fb', // HM-10 / most 58mm
        '00002a19-0000-1000-8000-00805f9b34fb',
        '49535343-8841-43f4-a8d4-ecbe34729bb3', // ISSC write char
        '49535343-1e4d-4bd9-ba61-23c647249616', // ISSC write-without-response
        '0000ff02-0000-1000-8000-00805f9b34fb', // FF02 write
        '0000ff01-0000-1000-8000-00805f9b34fb',
      ];
      let characteristic = null;
      for (const cid of characteristicCandidates) {
        try { characteristic = await service.getCharacteristic(cid); break; } catch (err) {}
      }
      if (!characteristic) {
        const characteristics = await service.getCharacteristics();
        // Prefer a characteristic that supports write or writeWithoutResponse
        characteristic = characteristics.find(c => c.properties?.write || c.properties?.writeWithoutResponse)
          || characteristics[0] || null;
      }
      if (!characteristic) throw new Error('No writable printer characteristic found');
      setPrinterDevice(device);
      setPrinterCharacteristic(characteristic);
      showToast(`Bluetooth printer connected: ${device.name || 'Printer'}`);
    } catch (err) {
      console.error('Bluetooth printer connect failed', err);
      setPrinterError(err.message || 'Connection failed');
      resetPrinter();
      showToast(`Bluetooth connect failed: ${err.message || err}`, 'error');
    }
  };

  const chunkWrite = async (characteristic, data) => {
    // 58mm printers work best with 100-byte chunks and slight delays between writes
    const MTU = 100;
    const useWithoutResponse = characteristic.properties?.writeWithoutResponse;
    for (let i = 0; i < data.length; i += MTU) {
      const chunk = data.slice(i, i + MTU);
      let retries = 3;
      while (retries > 0) {
        try {
          if (useWithoutResponse) {
            await characteristic.writeValueWithoutResponse(chunk);
          } else {
            await characteristic.writeValueWithResponse(chunk);
          }
          break;
        } catch (err) {
          retries--;
          if (retries === 0) throw err;
          // Wait longer on GATT errors before retrying
          await new Promise(resolve => setTimeout(resolve, 300));
        }
      }
      // Small delay between chunks to prevent buffer overflow on 58mm printers
      await new Promise(resolve => setTimeout(resolve, 80));
    }
  };

  const buildBluetoothReceipt = (order) => {
    // 58mm thermal printer: ~32 characters per line at standard font
    const WIDTH = 32;
    const SEP = '-'.repeat(WIDTH);
    const date = new Date(order.created_at || Date.now());
    const lines = [
      CAFE_NAME,
      CAFE_ADDRESS,
      `Tel: ${CAFE_TEL}`,
      SEP,
      `Order#: ${order.order_number || order.id?.slice(-6).toUpperCase()}`,
      `${date.toLocaleDateString()} ${date.toLocaleTimeString()}`,
      `Pay: ${(order.payment_method || '').toUpperCase()}`,
      SEP,
      ...((order.items || []).map(i => {
        const price = `P${(i.price * i.qty).toFixed(2)}`;
        const nameQty = `${i.name} x${i.qty}`;
        // Truncate name if needed to fit 58mm width
        const maxNameLen = WIDTH - price.length - 1;
        const truncated = nameQty.length > maxNameLen ? nameQty.slice(0, maxNameLen - 1) + '.' : nameQty;
        return truncated.padEnd(WIDTH - price.length, ' ') + price;
      })),
      SEP,
      `Subtotal: P${parseFloat(order.subtotal).toFixed(2)}`,
      order.discount && parseFloat(order.discount) > 0 ? `Discount: -P${parseFloat(order.discount).toFixed(2)}` : null,
      `TOTAL: P${parseFloat(order.total).toFixed(2)}`,
      order.change > 0 ? `Change: P${parseFloat(order.change).toFixed(2)}` : null,
      order.note ? `Note: ${order.note}` : null,
      SEP,
      'Thank you! Come again',
      '\n\n\n'
    ];
    return lines.filter(Boolean).join('\n');
  };

  const sendBluetoothReceipt = async (order) => {
    if (!printerCharacteristic) {
      throw new Error('No connected Bluetooth printer');
    }
    // Re-establish GATT connection if it dropped
    if (printerDevice && !printerDevice.gatt.connected) {
      try {
        await printerDevice.gatt.connect();
      } catch (e) {
        throw new Error('Printer disconnected. Please reconnect.');
      }
    }
    const receiptText = buildBluetoothReceipt(order);
    const encoder = new TextEncoder();
    const textBytes = encoder.encode(receiptText);
    // ESC/POS init sequence: ESC @ (initialize printer) — compatible with 58mm printers
    const escInit = new Uint8Array([0x1B, 0x40]);
    const combined = new Uint8Array(escInit.length + textBytes.length);
    combined.set(escInit, 0);
    combined.set(textBytes, escInit.length);
    await chunkWrite(printerCharacteristic, combined);
  };

  const printReceipt = async (order) => {
    try {
      if (!printerCharacteristic || !printerDevice?.gatt?.connected) {
        // Don't auto-connect during checkout — it triggers a new browser permission prompt
        // which fails mid-flow. Show a clear message instead.
        showToast('No printer connected. Use "Connect BT" first, then re-print from Orders.', 'error');
        return;
      }
      await sendBluetoothReceipt(order);
      showToast('Receipt sent to printer ✓');
    } catch (err) {
      console.error('Bluetooth print failed', err);
      // Check for GATT-specific errors and give actionable guidance
      const msg = err.message || String(err);
      if (/gatt/i.test(msg) || /unknown/i.test(msg) || /disconnect/i.test(msg)) {
        resetPrinter();
        showToast('Printer disconnected. Reconnect via "Connect BT" and reprint.', 'error');
      } else {
        showToast(`Print failed: ${msg}`, 'error');
      }
    }
  };

  const createBranch = async ({ name, address }) => {
    if (!name) {
      setBranchSetupError('Branch name is required');
      return;
    }
    setBranchSetupSaving(true);
    setBranchSetupError('');
    const { data, error } = await db.from('pos_branches').insert({ name, address: address || null }).select().single();
    setBranchSetupSaving(false);
    if (error) {
      if (/row-level security/i.test(error.message || '') || /policy/i.test(error.message || '')) {
        setBranchSetupError('Branch creation blocked by Supabase RLS: disable row-level security on pos_branches or add an insert policy for anon/public.');
      } else {
        setBranchSetupError(error.message || 'Could not create branch');
      }
      return;
    }
    if (data?.id) {
      const branchId = data.id;
      setCurrentBranch(branchId);
      localStorage.setItem('pos_branch', branchId);
      setTab('pos');
      loadData(branchId);
      showToast('Branch created');
    }
  };

  const loadData = useCallback(async (overrideBranchId) => {
    setLoading(true);
    // load branches first
    const { data: bdata } = await db.from('pos_branches').select('*').order('name');
    const branchList = bdata || [];
    setBranches(branchList);
    // ensure currentBranch points to a valid branch
    let branchId = overrideBranchId || currentBranch;
    if (!branchId || !branchList.some(b => b.id === branchId)) {
      if (branchList.length) {
        branchId = branchList[0].id;
        setCurrentBranch(branchId);
        localStorage.setItem('pos_branch', branchId);
      } else {
        branchId = '';
        setCurrentBranch('');
        localStorage.removeItem('pos_branch');
      }
    }

    const proms = [
      db.from('pos_categories').select('*').order('sort_order'),
    ];
    // products, orders and expenses filtered by branch
    if (branchId) {
      proms.push(db.from('pos_products').select('*').eq('branch_id', branchId).order('name'));
      proms.push(db.from('pos_orders').select('*').eq('branch_id', branchId).order('created_at', { ascending: false }).limit(200));
      proms.push(db.from('pos_expenses').select('*').eq('branch_id', branchId).order('created_at', { ascending: false }).limit(200));
    } else {
      proms.push(db.from('pos_products').select('*').order('name'));
      proms.push(db.from('pos_orders').select('*').order('created_at', { ascending: false }).limit(200));
      proms.push(db.from('pos_expenses').select('*').order('created_at', { ascending: false }).limit(200));
    }

    const results = await Promise.all(proms);
    const cats = results[0].data;
    const prods = results[1].data;
    const ords = results[2].data;
    const exps = results[3].data;

    setCategories(cats || []);
    setProducts(prods || []);
    setOrders(ords || []);
    setExpenses(exps || []);
    setLoading(false);
  }, [db, currentBranch]);

  useEffect(() => { loadData(); }, [loadData]);

  // Cart helpers
  const addToCart = (product) => {
    setCart(prev => {
      const existing = prev.find(i => i.id === product.id);
      if (existing) return prev.map(i => i.id === product.id ? {...i, qty: i.qty+1} : i);
      return [...prev, { ...product, qty: 1 }];
    });
  };

  const updateQty = (id, delta) => {
    setCart(prev => {
      const updated = prev.map(i => i.id === id ? {...i, qty: i.qty+delta} : i).filter(i => i.qty > 0);
      return updated;
    });
  };

  const clearCart = () => { setCart([]); setNote(''); setCashGiven(''); setPaymentMethod('cash'); setSelectedDiscountId(''); };

  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const appliedDiscount = (() => {
    const d = discounts.find(x => x.id === selectedDiscountId);
    return d ? Number(d.percent) : 0;
  })();
  const discountAmount = parseFloat((subtotal * (appliedDiscount / 100)).toFixed(2));
  const total = parseFloat((subtotal - discountAmount).toFixed(2));
  const change = paymentMethod === 'cash' ? Math.max(0, parseFloat(cashGiven || 0) - total) : 0;

  // Checkout
  const processOrder = async () => {
    if (cart.length === 0) return;
    if (paymentMethod === 'cash' && parseFloat(cashGiven || 0) < total) {
      showToast('Cash given is less than total', 'error'); return;
    }
    const order = {
      items: cart.map(i => ({ id: i.id, name: i.name, price: i.price, qty: i.qty })),
      subtotal: parseFloat(subtotal.toFixed(2)),
      discount: parseFloat(discountAmount.toFixed(2)),
      total: parseFloat(total.toFixed(2)),
      payment_method: paymentMethod,
      note: note || null,
      branch_id: currentBranch || null,
    };
    const { data, error } = await db.from('pos_orders').insert(order).select().single();
    if (error) {
      const msg = 'Failed to save order: ' + (error.message || error.details || JSON.stringify(error));
      console.error('Order insert failed', error);
      setLastDbError(msg);
      showToast(msg, 'error');
      return;
    }
    setLastDbError(null);
    const savedOrder = { ...data, items: cart, change };
    setLastOrder(savedOrder);
    setOrders(prev => [data, ...prev]);
    setCheckoutOpen(false);
    setReceiptOpen(true);
    printReceipt(savedOrder);
    clearCart();
    setSelectedDiscountId('');
  };

  const openEditOrder = (order) => {
    setEditingOrder({ ...order, note: order.note || '', payment_method: order.payment_method || 'cash' });
    setOrderModalOpen(true);
  };

  const saveOrder = async () => {
    if (!editingOrder) return;
    const payload = {
      payment_method: editingOrder.payment_method,
      note: editingOrder.note || null,
    };
    const { data, error } = await db.from('pos_orders').update(payload).eq('id', editingOrder.id).select().single();
    if (error) {
      const msg = 'Failed to update order: ' + (error.message || error.details || JSON.stringify(error));
      console.error('Order update failed', error);
      setLastDbError(msg);
      showToast(msg, 'error');
      return;
    }
    setOrders(prev => prev.map(o => o.id === data.id ? { ...o, ...data } : o));
    setOrderModalOpen(false);
    setEditingOrder(null);
    showToast('Order updated');
  };

  const voidOrder = async (id) => {
    if (!confirm('Void this order? This will exclude it from totals.')) return;
    const { data, error } = await db.from('pos_orders').update({ status: 'voided' }).eq('id', id).select().single();
    if (error) {
      showToast('Failed to void order','error');
    } else {
      setOrders(prev => prev.map(o => o.id === id ? { ...o, status: 'voided' } : o));
      showToast('Order voided');
    }
  };

  // Expenses CRUD
  const openNewExpense = () => { setEditingExpense({ amount:'', description:'' }); setExpenseModalOpen(true); };

  const saveExpense = async () => {
    if (!editingExpense || !editingExpense.amount) { showToast('Amount required','error'); return; }
    const amount = parseFloat(editingExpense.amount);
    if (isNaN(amount) || amount <= 0) { showToast('Enter a valid amount','error'); return; }

    // Calculate cash on hand for today using loaded orders and expenses
    const today = new Date().toDateString();
    const todayCashSales = orders.filter(o => new Date(o.created_at).toDateString() === today && (o.payment_method||'').toLowerCase() === 'cash')
      .reduce((s,o) => s + parseFloat(o.total || 0), 0);
    const todayExpensesSum = expenses.filter(e => new Date(e.created_at).toDateString() === today)
      .reduce((s,e) => s + parseFloat(e.amount || 0), 0);
    const cashOnHandValue = todayCashSales - todayExpensesSum;
    let availableCash = cashOnHandValue;

    // If editing an existing expense for today, allow increasing up to (availableCash + originalAmount)
    if (editingExpense.id) {
      const orig = expenses.find(e => e.id === editingExpense.id);
      if (orig && new Date(orig.created_at).toDateString() === today) {
        availableCash += parseFloat(orig.amount || 0);
      }
    }

    if (amount > availableCash) {
      showToast(`Expense cannot exceed cash on hand (₱${availableCash.toFixed(2)})`, 'error');
      return;
    }

    const payload = { branch_id: currentBranch || null, amount: amount, description: editingExpense.description || null };
    let res;
    if (editingExpense.id) {
      res = await db.from('pos_expenses').update(payload).eq('id', editingExpense.id).select().single();
    } else {
      res = await db.from('pos_expenses').insert(payload).select().single();
    }
    if (res.error) {
      const msg = 'Failed to save expense: ' + (res.error.message || res.error.details || JSON.stringify(res.error));
      console.error('Expense save failed', res.error);
      setLastDbError(msg);
      showToast(msg, 'error');
    } else {
      setLastDbError(null);
      showToast('Expense saved'); setExpenseModalOpen(false); setEditingExpense(null); loadData(); }
  };

  const deleteExpense = async (id) => {
    if (!confirm('Delete this expense?')) return;
    const { error } = await db.from('pos_expenses').delete().eq('id', id);
    if (error) { showToast('Failed to delete','error'); }
    else { showToast('Deleted'); loadData(); }
  };

  // Discounts: local-managed templates persisted to localStorage
  useEffect(() => { try { localStorage.setItem('pos_discounts', JSON.stringify(discounts)); } catch(e){} }, [discounts]);

  const openNewDiscount = () => { setEditingDiscount({ id: null, name: '', percent: '' }); setDiscountModalOpen(true); };

  const saveDiscount = () => {
    if (!editingDiscount || !editingDiscount.name || editingDiscount.percent === '' ) { showToast('Name and percent required','error'); return; }
    const pct = parseFloat(editingDiscount.percent);
    if (isNaN(pct) || pct < 0) { showToast('Percent must be a number','error'); return; }
    if (editingDiscount.id) {
      setDiscounts(prev => prev.map(d => d.id === editingDiscount.id ? { ...d, name: editingDiscount.name, percent: pct } : d));
      showToast('Discount updated');
    } else {
      const id = Date.now().toString();
      setDiscounts(prev => [...prev, { id, name: editingDiscount.name, percent: pct }]);
      showToast('Discount added');
    }
    setDiscountModalOpen(false);
    setEditingDiscount(null);
  };

  const deleteDiscount = (id) => {
    if (!confirm('Delete this discount?')) return;
    setDiscounts(prev => prev.filter(d => d.id !== id));
    if (selectedDiscountId === id) setSelectedDiscountId('');
    showToast('Discount deleted');
  };

  const filteredProducts = useMemo(() => {
    return products.filter(p => {
      const matchCat = activeCategory === 'all' || p.category_id === activeCategory;
      const matchSearch = !search || p.name.toLowerCase().includes(search.toLowerCase());
      return matchCat && matchSearch && p.available;
    });
  }, [products, activeCategory, search]);

  // Reports helpers
  const activeOrders = useMemo(() => orders.filter(o => (o.status || 'completed') !== 'voided'), [orders]);
  const todayOrders = useMemo(() => {
    const today = new Date().toDateString();
    return activeOrders.filter(o => new Date(o.created_at).toDateString() === today);
  }, [activeOrders]);
  const todayRevenue = todayOrders.reduce((s, o) => s + parseFloat(o.total), 0);
  const totalRevenue = activeOrders.reduce((s, o) => s + parseFloat(o.total), 0);
  const now = new Date();
  const monthlyOrders = activeOrders.filter(o => {
    const d = new Date(o.created_at);
    return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear();
  });
  const monthlyRevenue = monthlyOrders.reduce((s, o) => s + parseFloat(o.total), 0);
  const paymentBreakdown = useMemo(() => {
    const map = {};
    activeOrders.forEach(o => { map[o.payment_method] = (map[o.payment_method] || 0) + parseFloat(o.total); });
    return map;
  }, [activeOrders]);

  if (loading) return (
    <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12}}>
      <div style={{fontSize:28}}><i className="bi bi-cup-fill"></i></div>
      <div style={{color:'var(--text2)',fontSize:14}}>Loading…</div>
    </div>
  );

  if (!loading && branches.length === 0) {
    return <BranchSetupScreen onCreateBranch={createBranch} saving={branchSetupSaving} error={branchSetupError} />;
  }

  return (
    <div style={{height:'100vh',display:'flex',flexDirection:'column',overflow:'hidden'}}>
      {/* Toast */}
      {toast && (
        <div style={{position:'fixed',top:16,left:'50%',transform:'translateX(-50%)',zIndex:1000,
          background: toast.type==='error' ? 'var(--red)' : 'var(--green)',
          color:'white',padding:'10px 20px',borderRadius:var_radius,fontSize:14,fontWeight:500,
          boxShadow:'0 4px 20px rgba(0,0,0,0.4)'}}>
          {toast.msg}
        </div>
      )}

      {/* Top nav */}
      <div className="top-nav">
        <div className="top-nav-title">
          <i className="bi bi-cup-fill" style={{fontSize:20}}></i>
          <span>Kape sa Harong</span>
        </div>
        <button className="mobile-menu-toggle" onClick={() => setMobileNavOpen(open => !open)}>
          <i className="bi bi-list" style={{fontSize:16}}></i>
        </button>
        <div className="tab-buttons">
          {[['pos','POS'],['reports','Reports'],['products','Products']].map(([id,label]) => (
            <button key={id} onClick={() => setTab(id)} className={tab===id ? 'tab-button active' : 'tab-button'}>
              {label}
            </button>
          ))}
        </div>
        <div className="tab-select-wrapper">
          <select value={tab} onChange={e => setTab(e.target.value)} style={{width:'100%'}}>
            {[['pos','POS'],['reports','Reports'],['products','Products']].map(([id,label]) => (
              <option key={id} value={id}>{label}</option>
            ))}
          </select>
        </div>
        <div className={mobileNavOpen ? 'mobile-nav-panel open' : 'mobile-nav-panel'}>
          <div className="top-nav-right">
            <select value={currentBranch} onChange={e => { setCurrentBranch(e.target.value); localStorage.setItem('pos_branch', e.target.value); }}
              style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text)',padding:'8px 10px',borderRadius:8,fontSize:13}}>
              {branches.map(b => <option key={b.id} value={b.id}>{b.name}</option>)}
              {branches.length === 0 && <option value="">No branches</option>}
            </select>
            <button onClick={() => setTab('products')}
              style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'6px 10px',borderRadius:8,fontSize:12}}>Manage</button>
            <button onClick={printerDevice?.gatt?.connected ? disconnectPrinter : connectPrinter}
              disabled={printerConnecting}
              style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'6px 10px',borderRadius:8,fontSize:12}}>
              {printerDevice?.gatt?.connected ? 'Disconnect BT' : 'Connect BT'}
            </button>
          </div>
          <div className="top-nav-date">
            {new Date().toLocaleDateString('en-PH',{weekday:'short',year:'numeric',month:'short',day:'numeric'})}
            <div style={{fontSize:12,color: printerDevice?.gatt?.connected ? 'var(--green)' : printerError ? 'var(--red)' : 'var(--text2)', marginTop:4}}>
              {printerDevice?.gatt?.connected ? `BT: ${printerDevice.name || 'Connected'}` : printerError || 'Bluetooth printer not connected'}
            </div>
          </div>
        </div>
      </div>
      {lastDbError && (
        <div style={{background:'rgba(224,85,85,0.14)',color:'var(--red)',padding:'10px 16px',fontSize:13,borderTop:'1px solid rgba(224,85,85,0.25)'}}>
          <strong>Database error:</strong> {lastDbError}
        </div>
      )}

      {/* POS Tab */}
      {tab === 'pos' && (
        <div className="pos-layout" style={{flex:1,display:'flex',flexWrap:'wrap',overflow:'hidden'}}>
          {/* Left - Menu */}
          <div className="menu-panel" style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',borderRight:'1px solid var(--border)',minWidth:0}}>
            {/* Search + Categories */}
            <div style={{padding:'12px',borderBottom:'1px solid var(--border)',background:'var(--bg2)'}}>
              <div style={{position:'relative',marginBottom:10}}>
                <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--text3)',fontSize:16}}><i className="bi bi-search"></i></span>
                <input value={search} onChange={e => setSearch(e.target.value)}
                  placeholder="Search menu…"
                  style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:8,
                    padding:'9px 12px 9px 36px',color:'var(--text)',fontSize:14}} />
              </div>
              <div style={{display:'flex',gap:8,overflowX:'auto',paddingBottom:2}}>
                <CatChip active={activeCategory==='all'} onClick={() => setActiveCategory('all')} label="All" />
                {categories.map(c => (
                  <CatChip key={c.id} active={activeCategory===c.id} onClick={() => setActiveCategory(c.id)} label={<><UiIcon icon={c.icon} />{c.name}</>} />
                ))}
              </div>
            </div>

            {/* Product Grid */}
            <div style={{flex:1,overflowY:'auto',padding:'12px',
              display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(150px,1fr))',gap:10,alignContent:'start'}}>
              {filteredProducts.map(p => (
                <ProductCard key={p.id} product={p} onAdd={() => addToCart(p)} />
              ))}
              {filteredProducts.length === 0 && (
                <div style={{gridColumn:'1/-1',textAlign:'center',padding:'3rem',color:'var(--text3)'}}>
                  {search ? `No results for "${search}"` : 'No products in this category'}
                </div>
              )}
            </div>
          </div>

          {/* Right - Cart */}
          <div className="cart-panel" style={{width:'100%',maxWidth:340,display:'flex',flexDirection:'column',background:'var(--bg2)'}}>
            <div style={{padding:'14px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div style={{fontWeight:600,fontSize:15}}>Current Order</div>
              {cart.length > 0 && (
                <button onClick={clearCart} style={{background:'var(--red-bg)',color:'var(--red)',padding:'4px 10px',borderRadius:6,fontSize:12}}>Clear</button>
              )}
            </div>

            <div style={{flex:1,overflowY:'auto',padding:'8px'}}>
              {cart.length === 0 && (
                <div style={{textAlign:'center',padding:'3rem 1rem',color:'var(--text3)'}}>
                  <div style={{fontSize:32,marginBottom:8}}><i className="bi bi-cart" /></div>
                  Tap items to add to order
                </div>
              )}
              {cart.map(item => (
                <CartItem key={item.id} item={item} onUpdate={(d) => updateQty(item.id, d)} />
              ))}
            </div>

            {/* Note */}
            <div style={{padding:'0 10px 8px'}}>
              <input value={note} onChange={e => setNote(e.target.value)}
                placeholder="Order note (optional)"
                style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:8,
                  padding:'8px 12px',color:'var(--text)',fontSize:13}} />
            </div>

            {/* Totals */}
            <div style={{padding:'10px 16px',borderTop:'1px solid var(--border)'}}>
              <Row label="Subtotal" value={`₱${subtotal.toFixed(2)}`} />
              <div style={{display:'flex',alignItems:'center',gap:8,margin:'8px 0'}}>
                <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
                  {discounts.map(d => (
                    <button key={d.id} onClick={() => setSelectedDiscountId(prev => prev === d.id ? '' : d.id)}
                      style={{padding:'6px 10px',borderRadius:8,fontSize:12,fontWeight:600,
                        background: selectedDiscountId === d.id ? 'var(--amber)' : 'var(--bg3)',
                        color: selectedDiscountId === d.id ? '#1a0f00' : 'var(--text2)',
                        border: `1px solid ${selectedDiscountId === d.id ? 'var(--amber)' : 'var(--border)'}`}}>
                      {d.name}
                    </button>
                  ))}
                </div>
                <button onClick={() => { setEditingDiscount(null); setDiscountModalOpen(true); }}
                  style={{marginLeft:'auto',background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'6px 10px',borderRadius:8,fontSize:12}}>Manage discounts</button>
              </div>
              {appliedDiscount > 0 && (
                <Row label={`Discount (${appliedDiscount}%)`} value={`-₱${discountAmount.toFixed(2)}`} muted={false} />
              )}
              <div style={{display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:18,
                margin:'8px 0',color:'var(--amber)'}}>
                <span>Total</span><span>₱{total.toFixed(2)}</span>
              </div>
            </div>

            {/* Payment method */}
            <div style={{padding:'0 10px 10px',display:'flex',gap:8,flexWrap:'wrap'}}>
              {[['cash','bi-cash-stack','Cash'],['card','bi-credit-card','Card'],['gcash','bi-phone','GCash'],['maya','bi-wallet','Maya'],['grab','bi-bicycle','Grab']].map(([k,icon,label]) => (
                <button key={k} onClick={() => setPaymentMethod(k)}
                  style={{flex:'1 1 120px',padding:'8px 4px',borderRadius:8,fontSize:11,fontWeight:500,
                    background: paymentMethod===k ? 'var(--amber)' : 'var(--bg3)',
                    color: paymentMethod===k ? '#1a0f00' : 'var(--text2)',
                    border:`1px solid ${paymentMethod===k ? 'var(--amber)' : 'var(--border)'}`,
                    transition:'all 0.15s'}}>
                  <span style={{display:'inline-flex',alignItems:'center',gap:6}}><i className={`bi ${icon}`} style={{fontSize:12}}></i>{label}</span>
                </button>
              ))}
            </div>

            {paymentMethod === 'cash' && cart.length > 0 && (
              <div style={{padding:'0 10px 10px'}}>
                <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:8}}>
                  {[100,200,300,400,500,1000].map(a => (
                    <button key={a} onClick={() => {
                      const s = parseFloat(a).toFixed(2);
                      setCashGiven(prev => (parseFloat(prev||0).toFixed(2) === s) ? '' : s);
                    }}
                      style={{padding:'8px 10px',borderRadius:8,fontSize:13,fontWeight:600,
                        background: parseFloat(cashGiven||0) === a ? 'var(--amber)' : 'var(--bg3)',
                        color: parseFloat(cashGiven||0) === a ? '#1a0f00' : 'var(--text2)',
                        border: `1px solid ${parseFloat(cashGiven||0) === a ? 'var(--amber)' : 'var(--border)'}`}}>
                      ₱{a}
                    </button>
                  ))}
                  <button onClick={() => { const s = total.toFixed(2); setCashGiven(prev => (parseFloat(prev||0).toFixed(2) === s) ? '' : s); }}
                    style={{padding:'8px 10px',borderRadius:8,fontSize:13,fontWeight:600,background: 'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)'}}>
                    Exact Amount
                  </button>
                </div>
                <input value={cashGiven} onChange={e => setCashGiven(e.target.value)} type="number"
                  placeholder="Cash given"
                  style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:8,
                    padding:'8px 12px',color:'var(--text)',fontSize:14}} />
                {cashGiven && parseFloat(cashGiven) >= total && (
                  <div style={{fontSize:13,color:'var(--green)',marginTop:6,fontWeight:500}}>
                    Change: ₱{(parseFloat(cashGiven) - total).toFixed(2)}
                  </div>
                )}
              </div>
            )}

            <div style={{padding:'0 10px 14px'}}>
              <button onClick={processOrder} disabled={cart.length === 0}
                style={{width:'100%',padding:'14px',background: cart.length > 0 ? 'var(--amber)' : 'var(--bg4)',
                  color: cart.length > 0 ? '#1a0f00' : 'var(--text3)',
                  borderRadius:10,fontWeight:700,fontSize:16,transition:'all 0.15s',
                  opacity: cart.length > 0 ? 1 : 0.5}}>
                {cart.length > 0 ? `Charge ₱${total.toFixed(2)}` : 'Add items to order'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Reports Tab */}
      {tab === 'reports' && (
        <div style={{flex:1,overflowY:'auto',padding:'1.5rem'}}>
          {(() => {
            const todayCashSales = todayOrders.filter(o => (o.payment_method||'').toLowerCase() === 'cash').reduce((s,o) => s + parseFloat(o.total || 0), 0);
            const todayExpenses = expenses.filter(e => new Date(e.created_at).toDateString() === new Date().toDateString());
            const todayExpensesTotal = todayExpenses.reduce((s,e) => s + parseFloat(e.amount || 0), 0);
            const manualCashBase = manualCashOnHand !== null ? manualCashOnHand : 0;
            const cashOnHand = manualCashBase + todayCashSales - todayExpensesTotal;
            return (
              <>
                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:12,marginBottom:'1.5rem'}}>
                  <StatCard label="Today's Revenue" value={`₱${todayRevenue.toFixed(2)}`} sub={`${todayOrders.length} orders`} color="var(--amber)" />
                  <StatCard label="Monthly Revenue" value={`₱${monthlyRevenue.toFixed(2)}`} sub={`${monthlyOrders.length} orders this month`} color="var(--green)" />
                  <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:var_radius,padding:'1rem 1.25rem'}}>
                    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
                      <div style={{fontSize:12,color:'var(--text3)'}}>Cash On Hand</div>
                      {editingCashOnHand ? (
                        <button onClick={() => { setEditingCashOnHand(false); setCashOnHandInput(''); }}
                          style={{background:'transparent',border:'1px solid var(--border)',color:'var(--text2)',padding:'4px 8px',borderRadius:8,fontSize:12}}>Cancel</button>
                      ) : (
                        <button onClick={() => { setEditingCashOnHand(true); setCashOnHandInput((manualCashOnHand !== null ? manualCashOnHand : 0).toFixed(2)); }}
                          style={{background:'transparent',border:'1px solid var(--border)',color:'var(--text2)',padding:'4px 8px',borderRadius:8,fontSize:12}}>Edit</button>
                      )}
                    </div>
                    {editingCashOnHand ? (
                      <div style={{display:'flex',gap:8,alignItems:'center',marginBottom:6,flexWrap:'wrap'}}>
                        <span style={{fontSize:20,fontWeight:700,color:'var(--green)'}}>₱</span>
                        <input value={cashOnHandInput} onChange={e => setCashOnHandInput(e.target.value)}
                          style={{flex:'0 0 120px',minWidth:0,background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 10px',color:'var(--text)',fontSize:18}} />
                        <button onClick={() => {
                          const value = parseFloat(cashOnHandInput);
                          if (isNaN(value)) { showToast('Enter a valid cash amount','error'); return; }
                          setManualCashOnHand(value);
                          setEditingCashOnHand(false);
                          showToast('Manual cash amount saved');
                        }}
                          style={{flex:'0 0 auto',background:'var(--amber)',color:'#1a0f00',padding:'8px 12px',borderRadius:8,fontWeight:600,fontSize:13}}>Save</button>
                      </div>
                    ) : (
                      <div style={{fontSize:22,fontWeight:700,color:'var(--green)',marginBottom:2}}>₱{cashOnHand.toFixed(2)}</div>
                    )}
                    <div style={{fontSize:12,color:'var(--text3)'}}>
                      Manual cash ₱{manualCashBase.toFixed(2)} · Cash sales ₱{todayCashSales.toFixed(2)} · Expenses ₱{todayExpensesTotal.toFixed(2)}
                      {manualCashOnHand !== null && !editingCashOnHand && (
                        <div style={{marginTop:4,color:'var(--amber)',fontSize:11}}>Starting cash added to cash on hand</div>
                      )}
                    </div>
                  </div>
                  {Object.entries(paymentBreakdown).map(([method, total]) => (
                    <StatCard key={method} label={method.charAt(0).toUpperCase()+method.slice(1)} value={`₱${total.toFixed(2)}`} sub="payment method" color="var(--blue)" />
                  ))}
                </div>
              </>
            );
          })()}

          <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:var_radius,overflow:'hidden'}}>
            <div style={{padding:'14px 16px',borderBottom:'1px solid var(--border)',fontWeight:600,fontSize:14}}>
              Recent Orders
            </div>
            <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)'}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                <div style={{fontWeight:600}}>Expenses</div>
                <div style={{display:'flex',gap:8}}>
                  <button onClick={openNewExpense} style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'6px 10px',borderRadius:8}}>+ Add Expense</button>
                </div>
              </div>
              <div style={{marginTop:10}}>
                <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                  <thead>
                    <tr style={{background:'var(--bg3)'}}>
                      <th style={{padding:'8px 10px',textAlign:'left',color:'var(--text2)'}}>Amount</th>
                      <th style={{padding:'8px 10px',textAlign:'left',color:'var(--text2)'}}>Description</th>
                      <th style={{padding:'8px 10px',textAlign:'left',color:'var(--text2)'}}>Date</th>
                      <th style={{padding:'8px 10px',textAlign:'right',color:'var(--text2)'}}></th>
                    </tr>
                  </thead>
                  <tbody>
                    {expenses.map(exp => (
                      <tr key={exp.id} style={{borderTop:'1px solid var(--border)'}}>
                        <td style={{padding:'8px 10px'}}>₱{parseFloat(exp.amount).toFixed(2)}</td>
                        <td style={{padding:'8px 10px',color:'var(--text2)'}}>{exp.description}</td>
                        <td style={{padding:'8px 10px',color:'var(--text3)'}}>{new Date(exp.created_at).toLocaleString()}</td>
                        <td style={{padding:'8px 10px',textAlign:'right'}}>
                          <button onClick={() => { setEditingExpense(exp); setExpenseModalOpen(true); }} style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'4px 8px',borderRadius:6,marginRight:6}}>Edit</button>
                          <button onClick={() => deleteExpense(exp.id)} style={{background:'var(--red-bg)',border:'1px solid var(--red)',color:'var(--red)',padding:'4px 8px',borderRadius:6}}>Del</button>
                        </td>
                      </tr>
                    ))}
                    {expenses.length === 0 && (
                      <tr><td colSpan={4} style={{padding:'10px',color:'var(--text3)'}}>No expenses</td></tr>
                    )}
                  </tbody>
                </table>
              </div>
            </div>
            <div style={{overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
                <thead>
                  <tr style={{background:'var(--bg3)'}}>
                    {['#','Date','Items','Payment','Total','Status',''].map(h => (
                      <th key={h} style={{padding:'10px 14px',textAlign:'left',color:'var(--text2)',fontWeight:500,fontSize:12,whiteSpace:'nowrap'}}>{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {orders.slice(0,50).map((o,i) => (
                    <tr key={o.id} style={{borderTop:'1px solid var(--border)',background: i%2===0 ? 'transparent' : 'rgba(255,255,255,0.01)', opacity: (o.status || 'completed') === 'voided' ? 0.65 : 1}}>
                      <td style={{padding:'10px 14px',fontFamily:'DM Mono',fontSize:12,color:'var(--text3)'}}>#{o.order_number || o.id.slice(-6)}</td>
                      <td style={{padding:'10px 14px',color:'var(--text2)',whiteSpace:'nowrap'}}>{new Date(o.created_at).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
                      <td style={{padding:'10px 14px',color:'var(--text2)'}}>{Array.isArray(o.items) ? o.items.reduce((s,i)=>s+i.qty,0) : '—'} items</td>
                      <td style={{padding:'10px 14px'}}>
                        <span style={{background:'var(--bg3)',border:'1px solid var(--border)',padding:'2px 8px',borderRadius:6,fontSize:11,fontWeight:500,textTransform:'capitalize'}}>{o.payment_method}</span>
                      </td>
                      <td style={{padding:'10px 14px',fontWeight:600,color:'var(--amber)'}}>₱{parseFloat(o.total).toFixed(2)}</td>
                      <td style={{padding:'10px 14px'}}>
                        {(o.status || 'completed') === 'voided' ? <span style={{color:'var(--red)',fontWeight:600}}>Voided</span> : <span style={{color:'var(--text2)'}}>Active</span>}
                      </td>
                      <td style={{padding:'10px 14px',display:'flex',gap:6,flexWrap:'wrap',alignItems:'center'}}>
                        <button onClick={() => openEditOrder(o)}
                          style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'4px 10px',borderRadius:6,fontSize:11}}
                          disabled={(o.status || 'completed') === 'voided'}>
                          Edit
                        </button>
                        <button onClick={() => voidOrder(o.id)}
                          style={{background:'var(--red-bg)',border:'1px solid var(--red)',color:'var(--red)',padding:'4px 10px',borderRadius:6,fontSize:11}}
                          disabled={(o.status || 'completed') === 'voided'}>
                          Void
                        </button>
                        <button onClick={() => printReceipt(o)}
                          style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'4px 10px',borderRadius:6,fontSize:11}}
                          disabled={(o.status || 'completed') === 'voided'}>
                          <span style={{display:'inline-flex',alignItems:'center',gap:6}}><i className="bi bi-printer" /> BT Print</span>
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      )}

      {orderModalOpen && editingOrder && (
        <Modal onClose={() => { setOrderModalOpen(false); setEditingOrder(null); }}>
          <div style={{fontWeight:700,fontSize:18,marginBottom:12}}>Edit Order</div>
          <div style={{marginBottom:14,fontSize:13,color:'var(--text2)'}}>
            Order #{editingOrder.order_number || editingOrder.id?.slice(-6).toUpperCase()} · {new Date(editingOrder.created_at).toLocaleString('en-PH')}
          </div>
          <div style={{background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:var_radius,padding:'12px',marginBottom:14}}>
            {Array.isArray(editingOrder.items) && editingOrder.items.map((item, index) => (
              <div key={`${item.id}-${index}`} style={{display:'flex',justifyContent:'space-between',fontSize:13,padding:'6px 0',borderBottom:index < editingOrder.items.length-1 ? '1px solid var(--border)' : 'none'}}>
                <span>{item.name} × {item.qty}</span>
                <span>₱{(item.price * item.qty).toFixed(2)}</span>
              </div>
            ))}
          </div>
          <div style={{marginBottom:10}}>
            <label style={{display:'block',fontSize:12,color:'var(--text2)',marginBottom:6}}>Payment Method</label>
            <select value={editingOrder.payment_method} onChange={e => setEditingOrder(prev => ({ ...prev, payment_method: e.target.value }))}
              style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:8,padding:'9px 12px',color:'var(--text)',fontSize:14}}>
              {['cash','card','gcash','maya'].map(method => (
                <option key={method} value={method}>{method.charAt(0).toUpperCase()+method.slice(1)}</option>
              ))}
            </select>
          </div>
          <div style={{marginBottom:16}}>
            <label style={{display:'block',fontSize:12,color:'var(--text2)',marginBottom:6}}>Order Note</label>
            <input value={editingOrder.note || ''} onChange={e => setEditingOrder(prev => ({ ...prev, note: e.target.value }))}
              style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:8,padding:'9px 12px',color:'var(--text)',fontSize:14}} />
          </div>
          <div style={{display:'flex',gap:10}}>
            <button onClick={() => { setOrderModalOpen(false); setEditingOrder(null); }}
              style={{flex:1,padding:'10px',background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',borderRadius:8}}>Cancel</button>
            <button onClick={saveOrder}
              style={{flex:1,padding:'10px',background:'var(--amber)',color:'#1a0f00',borderRadius:8,fontWeight:700}}>Save</button>
          </div>
        </Modal>
      )}

      {/* Products Tab */}
      {tab === 'products' && (
        <ProductsManager db={db} categories={categories} products={products} onRefresh={loadData} showToast={showToast} currentBranch={currentBranch} />
      )}

      {/* Receipt Modal */}
      {receiptOpen && lastOrder && (
        <Modal onClose={() => setReceiptOpen(false)}>
          <div style={{textAlign:'center',marginBottom:'1.5rem'}}>
            <div style={{fontSize:48,marginBottom:8}}><i className="bi bi-check-circle-fill" style={{color:'var(--green)'}}></i></div>
            <div style={{fontSize:20,fontWeight:700}}>Order Complete</div>
            <div style={{color:'var(--text2)',fontSize:14}}>#{lastOrder.order_number || lastOrder.id?.slice(-6).toUpperCase()}</div>
          </div>
          <div style={{background:'var(--bg3)',borderRadius:10,padding:'1rem',marginBottom:'1rem',fontSize:14}}>
            {lastOrder.items?.map(i => (
              <div key={i.id} style={{display:'flex',justifyContent:'space-between',padding:'4px 0',color:'var(--text2)'}}>
                <span>{i.name} × {i.qty}</span>
                <span>₱{(i.price*i.qty).toFixed(2)}</span>
              </div>
            ))}
            <div style={{borderTop:'1px solid var(--border)',marginTop:8,paddingTop:8}}>
              <Row label="Subtotal" value={`₱${parseFloat(lastOrder.subtotal).toFixed(2)}`} />
              <div style={{display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:16,marginTop:6,color:'var(--amber)'}}>
                <span>Total</span><span>₱{parseFloat(lastOrder.total).toFixed(2)}</span>
              </div>
              {lastOrder.change > 0 && (
                <div style={{display:'flex',justifyContent:'space-between',color:'var(--green)',fontWeight:500,marginTop:4}}>
                  <span>Change</span><span>₱{parseFloat(lastOrder.change).toFixed(2)}</span>
                </div>
              )}
            </div>
          </div>
          <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
            <button onClick={() => setReceiptOpen(false)}
              style={{flex:1,minWidth:130,padding:'12px',background:'var(--amber)',color:'#1a0f00',
                borderRadius:10,fontWeight:700,fontSize:14}}>
              New Order
            </button>
          </div>
        </Modal>
      )}
      {expenseModalOpen && (
        <Modal onClose={() => { setExpenseModalOpen(false); setEditingExpense(null); }}>
          <div style={{fontWeight:700,fontSize:18,marginBottom:8}}>{editingExpense && editingExpense.id ? 'Edit Expense' : 'Add Expense'}</div>
          <div style={{marginBottom:8}}>
            <label style={{display:'block',fontSize:12,color:'var(--text2)',marginBottom:6}}>Amount (₱)</label>
            <input value={editingExpense?.amount || ''} onChange={e => setEditingExpense(se => ({...(se||{}), amount: e.target.value}))} type="number" style={inputStyle} />
          </div>
          <div style={{marginBottom:12}}>
            <label style={{display:'block',fontSize:12,color:'var(--text2)',marginBottom:6}}>Description</label>
            <input value={editingExpense?.description || ''} onChange={e => setEditingExpense(se => ({...(se||{}), description: e.target.value}))} style={inputStyle} />
          </div>
          <div style={{display:'flex',gap:10}}>
            <button onClick={() => { setExpenseModalOpen(false); setEditingExpense(null); }} style={{flex:1,padding:'10px',background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',borderRadius:8}}>Cancel</button>
            <button onClick={saveExpense} style={{flex:1,padding:'10px',background:'var(--amber)',color:'#1a0f00',borderRadius:8,fontWeight:700}}>Save</button>
          </div>
        </Modal>
      )}
      {discountModalOpen && (
        <Modal onClose={() => { setDiscountModalOpen(false); setEditingDiscount(null); }}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <div style={{fontWeight:700,fontSize:18}}>{editingDiscount && editingDiscount.id ? 'Edit Discount' : 'Manage Discounts'}</div>
            <button onClick={openNewDiscount} style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'6px 10px',borderRadius:8}}>+ New</button>
          </div>
          <div style={{marginBottom:10}}>
            {discounts.length === 0 && <div style={{color:'var(--text3)'}}>No discounts defined.</div>}
            {discounts.map(d => (
              <div key={d.id} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
                <div>
                  <div style={{fontWeight:600}}>{d.name}</div>
                  <div style={{fontSize:12,color:'var(--text3)'}}>{d.percent}%</div>
                </div>
                <div style={{display:'flex',gap:8}}>
                  <button onClick={() => { setEditingDiscount(d); setDiscountModalOpen(true); }} style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'6px 10px',borderRadius:8}}>Edit</button>
                  <button onClick={() => deleteDiscount(d.id)} style={{background:'var(--red-bg)',border:'1px solid var(--red)',color:'var(--red)',padding:'6px 10px',borderRadius:8}}>Del</button>
                </div>
              </div>
            ))}
          </div>
          {editingDiscount && (
            <>
              <div style={{marginBottom:8}}>
                <label style={{display:'block',fontSize:12,color:'var(--text2)',marginBottom:6}}>Name</label>
                <input value={editingDiscount?.name || ''} onChange={e => setEditingDiscount(se => ({...(se||{}), name: e.target.value}))} style={inputStyle} />
              </div>
              <div style={{marginBottom:12}}>
                <label style={{display:'block',fontSize:12,color:'var(--text2)',marginBottom:6}}>Percent</label>
                <input value={editingDiscount?.percent || ''} onChange={e => setEditingDiscount(se => ({...(se||{}), percent: e.target.value}))} type="number" style={inputStyle} />
              </div>
              <div style={{display:'flex',gap:10}}>
                <button onClick={() => { setDiscountModalOpen(false); setEditingDiscount(null); }} style={{flex:1,padding:'10px',background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',borderRadius:8}}>Cancel</button>
                <button onClick={saveDiscount} style={{flex:1,padding:'10px',background:'var(--amber)',color:'#1a0f00',borderRadius:8,fontWeight:700}}>Save</button>
              </div>
            </>
          )}
        </Modal>
      )}
    </div>
  );
}

// ── Sub-components ────────────────────────────────────────────────────────────
function CatChip({ active, onClick, label }) {
  return (
    <button onClick={onClick} style={{
      whiteSpace:'nowrap',padding:'6px 14px',borderRadius:20,fontSize:13,fontWeight: active ? 600 : 400,
      background: active ? 'var(--amber)' : 'var(--bg3)',
      color: active ? '#1a0f00' : 'var(--text2)',
      border: `1px solid ${active ? 'var(--amber)' : 'var(--border)'}`,
      transition:'all 0.15s'
    }}>{label}</button>
  );
}

function UiIcon({ icon, style }) {
  const iconClass = icon && icon.startsWith('bi-') ? icon : 'bi-basket3-fill';
  return <i className={`bi ${iconClass}`} style={{fontSize:18,verticalAlign:'middle',marginRight:6,...style}}></i>;
}

function ProductCard({ product, onAdd }) {
  const [pressed, setPressed] = useState(false);
  return (
    <button onPointerDown={() => setPressed(true)} onPointerUp={() => setPressed(false)} onPointerLeave={() => setPressed(false)}
      onClick={onAdd}
      style={{
        background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:var_radius,
        padding:'14px 12px',textAlign:'left',cursor:'pointer',
        transform: pressed ? 'scale(0.97)' : 'scale(1)',transition:'transform 0.1s,border-color 0.15s',
        display:'flex',flexDirection:'column',gap:6
      }}>
      <div style={{fontSize:24}}>
        <UiIcon icon={product.icon || 'bi-basket3-fill'} style={{fontSize:24,marginRight:0}} />
      </div>
      <div style={{fontSize:13,fontWeight:500,color:'var(--text)',lineHeight:1.3}}>{product.name}</div>
      <div style={{fontSize:15,fontWeight:700,color:'var(--amber)'}}>₱{parseFloat(product.price).toFixed(2)}</div>
    </button>
  );
}

function CartItem({ item, onUpdate }) {
  return (
    <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',
      background:'var(--bg3)',borderRadius:10,marginBottom:6}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
        <div style={{fontSize:12,color:'var(--text2)'}}>₱{item.price.toFixed(2)} each</div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        <button onClick={() => onUpdate(-1)} style={{width:26,height:26,borderRadius:6,background:'var(--bg4)',
          color:'var(--text2)',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>−</button>
        <span style={{fontSize:14,fontWeight:600,minWidth:16,textAlign:'center'}}>{item.qty}</span>
        <button onClick={() => onUpdate(1)} style={{width:26,height:26,borderRadius:6,background:'var(--amber)',
          color:'#1a0f00',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>+</button>
      </div>
      <div style={{fontSize:13,fontWeight:600,color:'var(--amber)',minWidth:56,textAlign:'right'}}>
        ₱{(item.price * item.qty).toFixed(2)}
      </div>
    </div>
  );
}

function Row({ label, value, muted }) {
  return (
    <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color: muted ? 'var(--text3)' : 'var(--text2)',marginBottom:4}}>
      <span>{label}</span><span>{value}</span>
    </div>
  );
}

function StatCard({ label, value, sub, color }) {
  return (
    <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:var_radius,padding:'1rem 1.25rem'}}>
      <div style={{fontSize:12,color:'var(--text3)',marginBottom:4}}>{label}</div>
      <div style={{fontSize:22,fontWeight:700,color: color || 'var(--text)',marginBottom:2}}>{value}</div>
      <div style={{fontSize:12,color:'var(--text3)'}}>{sub}</div>
    </div>
  );
}

function Modal({ children, onClose }) {
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',display:'flex',
      alignItems:'center',justifyContent:'center',zIndex:100,padding:'1rem'}} onClick={onClose}>
      <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:16,
        padding:'1.5rem',width:'100%',maxWidth:420,maxHeight:'90vh',overflowY:'auto'}}
        onClick={e => e.stopPropagation()}>
        {children}
      </div>
    </div>
  );
}

// ── Products Manager ──────────────────────────────────────────────────────────
function ProductsManager({ db, categories, products, onRefresh, showToast, currentBranch }) {
  const [form, setForm] = useState({ name:'', price:'', category_id:'', icon:'bi-basket3-fill', available:true });
  const [editing, setEditing] = useState(null);
  const [saving, setSaving] = useState(false);
  const [catForm, setCatForm] = useState({ name:'', icon:'bi-cup-fill' });
  const [showCatForm, setShowCatForm] = useState(false);
  const [showIconDropdown, setShowIconDropdown] = useState(false);
  const [categoryDeleteMode, setCategoryDeleteMode] = useState(false);
  const [branchesList, setBranchesList] = useState([]);
  const [branchForm, setBranchForm] = useState({ name:'', address:'' });

  const ICONS = ['bi-cup-fill','bi-cup-straw','bi-mug-hot','bi-basket3-fill'];

  const save = async () => {
    if (!form.name || !form.price) { showToast('Name and price required','error'); return; }
    setSaving(true);
    const data = { name: form.name, price: parseFloat(form.price), category_id: form.category_id || null, available: form.available };
    if (currentBranch) data.branch_id = currentBranch;
    const op = editing
      ? db.from('pos_products').update(data).eq('id', editing)
      : db.from('pos_products').insert(data);
    const { error } = await op;
    if (error) { showToast('Error saving product','error'); }
    else { showToast(editing ? 'Product updated' : 'Product added'); setForm({name:'',price:'',category_id:'',icon:'bi-basket3-fill',available:true}); setEditing(null); onRefresh(); }
    setSaving(false);
  };

  const toggle = async (product) => {
    await db.from('pos_products').update({ available: !product.available }).eq('id', product.id);
    onRefresh();
  };

  const del = async (id) => {
    if (!confirm('Delete this product?')) return;
    await db.from('pos_products').delete().eq('id', id);
    onRefresh(); showToast('Product deleted');
  };

  const saveCategory = async () => {
    if (!catForm.name) return;
    await db.from('pos_categories').insert({ name: catForm.name, icon: catForm.icon, sort_order: categories.length+1 });
    setCatForm({name:'',icon:'bi-cup-fill'}); setShowCatForm(false); onRefresh();
  };

  const deleteCategory = async (id) => {
    if (!confirm('Delete this category? Products in this category will be set to no category.')) return;
    const { error } = await db.from('pos_categories').delete().eq('id', id);
    if (error) { showToast('Error deleting category','error'); }
    else { showToast('Category deleted'); onRefresh(); }
  };

  const loadBranches = async () => {
    const { data } = await db.from('pos_branches').select('*').order('name');
    setBranchesList(data || []);
  };

  useEffect(() => { loadBranches(); }, []);

  const saveBranch = async () => {
    if (!branchForm.name) return;
    await db.from('pos_branches').insert({ name: branchForm.name, address: branchForm.address });
    setBranchForm({ name:'', address:'' }); loadBranches(); onRefresh();
  };

  const deleteBranch = async (id) => {
    if (!confirm('Delete branch? This will remove branch products and data.')) return;
    await db.from('pos_branches').delete().eq('id', id);
    loadBranches(); onRefresh();
  };

  const editProduct = (p) => {
    setEditing(p.id);
    setForm({ name: p.name, price: String(p.price), category_id: p.category_id || '', icon: 'bi-basket3-fill', available: p.available });
    window.scrollTo(0,0);
  };

  return (
    <div style={{flex:1,overflowY:'auto',padding:'1.5rem',display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1.5rem',alignItems:'start'}}>
      {/* Left - Add/Edit form */}
      <div>
        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:var_radius,padding:'1.25rem',marginBottom:'1rem'}}>
          <div style={{fontWeight:600,marginBottom:'1rem',fontSize:15}}>{editing ? 'Edit Product' : 'Add Product'}</div>
          <Field label="Name">
            <input value={form.name} onChange={e => setForm(f=>({...f,name:e.target.value}))} placeholder="e.g. Latte"
              style={inputStyle} />
          </Field>
          <Field label="Price (₱)">
            <input value={form.price} onChange={e => setForm(f=>({...f,price:e.target.value}))} type="number" placeholder="0.00"
              style={inputStyle} />
          </Field>
          <Field label="Category">
            <select value={form.category_id} onChange={e => setForm(f=>({...f,category_id:e.target.value}))} style={inputStyle}>
              <option value="">No category</option>
              {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
            </select>
          </Field>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:'1rem'}}>
            <input type="checkbox" checked={form.available} onChange={e => setForm(f=>({...f,available:e.target.checked}))} id="avail" />
            <label htmlFor="avail" style={{fontSize:13,color:'var(--text2)',cursor:'pointer'}}>Available for sale</label>
          </div>
          <div style={{display:'flex',gap:8}}>
            {editing && (
              <button onClick={() => { setEditing(null); setForm({name:'',price:'',category_id:'',icon:'bi-basket3-fill',available:true}); }}
                style={{flex:1,padding:'10px',background:'var(--bg3)',border:'1px solid var(--border2)',color:'var(--text2)',borderRadius:8,fontSize:13}}>Cancel</button>
            )}
            <button onClick={save} disabled={saving}
              style={{flex:2,padding:'10px',background:'var(--amber)',color:'#1a0f00',borderRadius:8,fontWeight:600,fontSize:14}}>
              {saving ? 'Saving…' : editing ? 'Update Product' : 'Add Product'}
            </button>
          </div>
        </div>

        {/* Categories */}
        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:var_radius,padding:'1.25rem'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>
            <div style={{fontWeight:600,fontSize:15}}>Categories</div>
            <div style={{display:'flex',gap:8}}>
              <button onClick={() => setCategoryDeleteMode(m => !m)}
                style={{background: categoryDeleteMode ? 'var(--red-bg)' : 'var(--bg3)',border:`1px solid ${categoryDeleteMode ? 'var(--red)' : 'var(--border)'}`,color: categoryDeleteMode ? 'var(--red)' : 'var(--text2)',padding:'4px 12px',borderRadius:6,fontSize:12}}>
                {categoryDeleteMode ? 'Cancel Delete' : 'Delete Category'}
              </button>
              <button onClick={() => setShowCatForm(!showCatForm)} style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'4px 12px',borderRadius:6,fontSize:12}}>
                {showCatForm ? 'Cancel' : '+ Add'}
              </button>
            </div>
          </div>
          {showCatForm && (
            <div style={{marginBottom:'1rem'}}>
              <div style={{display:'flex',gap:8,marginBottom:'0.75rem',alignItems:'center'}}>
                <div style={{position:'relative',display:'inline-flex',alignItems:'center',gap:8,padding:'10px 12px',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:16,cursor:'pointer'}}>
                  <div style={{width:36,height:36,display:'inline-flex',alignItems:'center',justifyContent:'center',borderRadius:12,background:'rgba(193,149,96,0.1)',color:'var(--amber)'}}>
                    <i className={`bi ${catForm.icon}`} style={{fontSize:18}}></i>
                  </div>
                  <button type="button" onClick={() => setShowIconDropdown(d => !d)}
                    style={{background:'transparent',border:'none',color:'var(--text)',fontSize:14,outline:'none',display:'inline-flex',alignItems:'center',gap:6}}>
                    <i className="bi bi-caret-down-fill" style={{fontSize:12}}></i>
                  </button>
                  {showIconDropdown && (
                    <div style={{position:'absolute',top:'100%',left:0,marginTop:8,padding:10,background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:14,boxShadow:'0 16px 30px rgba(0,0,0,0.25)',zIndex:10,display:'grid',gridTemplateColumns:'repeat(5,44px)',gap:8}}>
                      {ICONS.map(icon => (
                        <button key={icon} type="button" onClick={() => { setCatForm(f => ({ ...f, icon })); setShowIconDropdown(false); }}
