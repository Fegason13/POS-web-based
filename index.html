    --bg4: #2a2a2a;
    --border: #333;

  @media print {

 <script src="/_sdk/telemetry_sdk.js"></script></head>
 <body>
  <div id="root"></div>
  <div id="print-area" style="display:none"></div>
  <script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

// Initialize Element SDK
window.elementSdk.init({
  defaultConfig: {},
  onConfigChange: async () => {},
  mapToCapabilities: () => ({ recolorables: [], borderables: [], fontEditable: undefined, fontSizeable: undefined }),
  mapToEditPanelValues: () => new Map()
});

const SCHEMA_SQL = `
-- Branches
create table if not exists pos_branches (
  id uuid primary key default gen_random_uuid(),
  name text not null,
  address text,
  phone text,
  created_at timestamptz default now()
);

-- Categories (per branch)
create table if not exists pos_categories (
  id uuid primary key default gen_random_uuid(),
  branch_id uuid references pos_branches(id) on delete cascade,
  name text not null,
  icon text default '☕',
  sort_order int default 0,
  created_at timestamptz default now()
);

-- Products (per branch)
create table if not exists pos_products (
  id uuid primary key default gen_random_uuid(),
  branch_id uuid references pos_branches(id) on delete cascade,
  category_id uuid references pos_categories(id) on delete set null,
  name text not null,
  price numeric(10,2) not null,
  description text,
  available boolean default true,
  created_at timestamptz default now()
);

-- Orders (per branch)
create table if not exists pos_orders (
  id uuid primary key default gen_random_uuid(),
  branch_id uuid references pos_branches(id) on delete cascade,
  order_number serial,
  items jsonb not null,
  subtotal numeric(10,2) not null,
  tax numeric(10,2) not null,
  discount numeric(10,2) default 0,
  total numeric(10,2) not null,
  payment_method text not null,
  status text default 'completed',
  note text,
  created_at timestamptz default now()
);

-- Cash on hand tracking (per branch per day)
create table if not exists pos_cash_register (
  id uuid primary key default gen_random_uuid(),
  branch_id uuid references pos_branches(id) on delete cascade,
  date date not null default current_date,
  opening_cash numeric(10,2) default 0,
  adjustments jsonb default '[]',
  notes text,
  created_at timestamptz default now(),
  unique(branch_id, date)
);
`;

// ── Config Screen ────────────────────────────────────────────────────────────
function ConfigScreen({ onConnect }) {
  const [url, setUrl] = useState(localStorage.getItem('sb_url') || '');
  const [key, setKey] = useState(localStorage.getItem('sb_key') || '');
  const [testing, setTesting] = useState(false);
  const [err, setErr] = useState('');
  const [copied, setCopied] = useState(false);

  const connect = async () => {
    if (!url || !key) { setErr('Both fields required'); return; }
    setTesting(true); setErr('');
    try {
      const client = supabase.createClient(url.trim(), key.trim());
      const { error } = await client.from('pos_branches').select('id').limit(1);
      if (error && error.code === '42P01') {
        setErr('Tables not found — run the SQL schema first');
      } else if (error) {
        setErr('Connection error: ' + error.message);
      } else {
        localStorage.setItem('sb_url', url.trim());
        localStorage.setItem('sb_key', key.trim());
        onConnect(url.trim(), key.trim());
      }
    } catch (e) { setErr('Connection failed: ' + e.message); }
    setTesting(false);
  };

  const copySQL = () => {
    navigator.clipboard.writeText(SCHEMA_SQL);
    setCopied(true); setTimeout(() => setCopied(false), 2000);
  };

  return (
    <div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',padding:'2rem',background:'var(--bg)',overflowY:'auto'}}>
      <div style={{width:'100%',maxWidth:540}}>
        <div style={{marginBottom:'2.5rem'}}>
          <div style={{fontSize:32,fontWeight:700,letterSpacing:'-1px',marginBottom:6}}>☕ CafePOS</div>
          <div style={{color:'var(--text2)',fontSize:14}}>Multi-branch Point of Sale — Connect your Supabase project</div>
        </div>

        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'1.5rem',marginBottom:'1rem'}}>
          <label style={{display:'block',fontSize:13,color:'var(--text2)',marginBottom:6}}>Supabase Project URL</label>
          <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://xxxx.supabase.co"
            style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:8,padding:'10px 12px',color:'var(--text)',fontSize:14,marginBottom:'1rem'}} />
          <label style={{display:'block',fontSize:13,color:'var(--text2)',marginBottom:6}}>Anon/Public Key</label>
          <input value={key} onChange={e=>setKey(e.target.value)} type="password" placeholder="eyJhbGciOi..."
            style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:8,padding:'10px 12px',color:'var(--text)',fontSize:14}} />
          {err && <div style={{color:'var(--red)',fontSize:13,marginTop:10}}>{err}</div>}
          <button onClick={connect} disabled={testing}
            style={{width:'100%',marginTop:'1rem',background:'var(--amber)',color:'#1a0f00',padding:'12px',borderRadius:8,fontWeight:600,fontSize:15,opacity:testing?0.7:1}}>
            {testing ? 'Connecting…' : 'Connect →'}
          </button>
        </div>

        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'1.5rem'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'1rem'}}>
            <div style={{fontSize:13,fontWeight:600}}>Step 1 — Run this SQL in Supabase</div>
            <button onClick={copySQL} style={{background:'var(--bg3)',border:'1px solid var(--border2)',color:'var(--text2)',padding:'4px 10px',borderRadius:6,fontSize:12}}>
              {copied ? '✓ Copied' : 'Copy SQL'}
            </button>
          </div>
          <pre style={{fontFamily:'DM Mono',fontSize:11,color:'var(--text3)',overflowX:'auto',whiteSpace:'pre-wrap',lineHeight:1.6,maxHeight:200,overflowY:'auto'}}>
{SCHEMA_SQL.trim()}
          </pre>
        </div>
      </div>
    </div>
  );
}

// ── Main POS App ─────────────────────────────────────────────────────────────
function POSApp({ supabaseUrl, supabaseKey }) {
  const db = useMemo(() => supabase.createClient(supabaseUrl, supabaseKey), [supabaseUrl, supabaseKey]);

  const [tab, setTab] = useState('pos');
  const [branches, setBranches] = useState([]);
  const [activeBranch, setActiveBranch] = useState(null);
  const [categories, setCategories] = useState([]);
  const [products, setProducts] = useState([]);
  const [orders, setOrders] = useState([]);
  const [cashRegister, setCashRegister] = useState(null);
  const [activeCategory, setActiveCategory] = useState('all');
  const [search, setSearch] = useState('');
  const [cart, setCart] = useState([]);
  const [note, setNote] = useState('');
  const [paymentMethod, setPaymentMethod] = useState('cash');
  const [cashGiven, setCashGiven] = useState('');
  const [lastOrder, setLastOrder] = useState(null);
  const [receiptOpen, setReceiptOpen] = useState(false);
  const [loading, setLoading] = useState(true);
  const [toast, setToast] = useState(null);
  const [branchModalOpen, setBranchModalOpen] = useState(false);
  const [branchDropdownOpen, setBranchDropdownOpen] = useState(false);

  const TAX_RATE = 0.12;

  const showToast = (msg, type='success') => {
    setToast({msg,type});
    setTimeout(() => setToast(null), 2500);
  };

  // Load branches
  const loadBranches = useCallback(async () => {
    const { data } = await db.from('pos_branches').select('*').order('created_at');
    setBranches(data || []);
    if (data && data.length > 0 && !activeBranch) {
      const savedBranch = localStorage.getItem('active_branch');
      const found = data.find(b => b.id === savedBranch);
      setActiveBranch(found || data[0]);
    }
    if (!data || data.length === 0) setBranchModalOpen(true);
    setLoading(false);
  }, [db]);

  // Load branch-specific data
  const loadBranchData = useCallback(async () => {
    if (!activeBranch) return;
    const branchId = activeBranch.id;
    localStorage.setItem('active_branch', branchId);

    const [{ data: cats }, { data: prods }, { data: ords }] = await Promise.all([
      db.from('pos_categories').select('*').eq('branch_id', branchId).order('sort_order'),
      db.from('pos_products').select('*').eq('branch_id', branchId).order('name'),
      db.from('pos_orders').select('*').eq('branch_id', branchId).order('created_at', { ascending: false }).limit(200),
    ]);
    setCategories(cats || []);
    setProducts(prods || []);
    setOrders(ords || []);

    // Load or create today's cash register
    const today = new Date().toISOString().split('T')[0];
    const { data: reg } = await db.from('pos_cash_register').select('*').eq('branch_id', branchId).eq('date', today).single();
    if (reg) { setCashRegister(reg); }
    else {
      const { data: newReg } = await db.from('pos_cash_register').insert({ branch_id: branchId, date: today, opening_cash: 0, adjustments: [] }).select().single();
      setCashRegister(newReg);
    }
  }, [db, activeBranch]);

  useEffect(() => { loadBranches(); }, [loadBranches]);
  useEffect(() => { if (activeBranch) loadBranchData(); }, [loadBranchData]);

  // Cart helpers
  const addToCart = (product) => {
    setCart(prev => {
      const existing = prev.find(i => i.id === product.id);
      if (existing) return prev.map(i => i.id === product.id ? {...i, qty: i.qty+1} : i);
      return [...prev, { ...product, qty: 1 }];
    });
  };
  const updateQty = (id, delta) => setCart(prev => prev.map(i => i.id === id ? {...i, qty: i.qty+delta} : i).filter(i => i.qty > 0));
  const clearCart = () => { setCart([]); setNote(''); setCashGiven(''); setPaymentMethod('cash'); };

  const subtotal = cart.reduce((s, i) => s + i.price * i.qty, 0);
  const tax = subtotal * TAX_RATE;
  const total = subtotal + tax;
  const change = paymentMethod === 'cash' ? Math.max(0, parseFloat(cashGiven || 0) - total) : 0;

  const processOrder = async () => {
    if (cart.length === 0) return;
    if (paymentMethod === 'cash' && parseFloat(cashGiven || 0) < total) {
      showToast('Cash given is less than total', 'error'); return;
    }
    const order = {
      branch_id: activeBranch.id,
      items: cart.map(i => ({ id: i.id, name: i.name, price: i.price, qty: i.qty })),
      subtotal: parseFloat(subtotal.toFixed(2)),
      tax: parseFloat(tax.toFixed(2)),
      discount: 0,
      total: parseFloat(total.toFixed(2)),
      payment_method: paymentMethod,
      note: note || null,
    };
    const { data, error } = await db.from('pos_orders').insert(order).select().single();
    if (error) { showToast('Failed to save order', 'error'); return; }
    setLastOrder({ ...data, items: cart, change });
    setOrders(prev => [data, ...prev]);
    setReceiptOpen(true);
    clearCart();
    showToast('Order complete!');
  };

  const filteredProducts = useMemo(() => {
    return products.filter(p => {
      const matchCat = activeCategory === 'all' || p.category_id === activeCategory;
      const matchSearch = !search || p.name.toLowerCase().includes(search.toLowerCase());
      return matchCat && matchSearch && p.available;
    });
  }, [products, activeCategory, search]);

  const todayOrders = useMemo(() => {
    const today = new Date().toDateString();
    return orders.filter(o => new Date(o.created_at).toDateString() === today);
  }, [orders]);

  const todayRevenue = todayOrders.reduce((s, o) => s + parseFloat(o.total), 0);
  const todayCashSales = todayOrders.filter(o => o.payment_method === 'cash').reduce((s, o) => s + parseFloat(o.total), 0);

  const printReceipt = (order) => {
    const el = document.getElementById('print-area');
    el.style.display = 'block';
    const date = new Date(order.created_at || Date.now());
    el.innerHTML = `
      <div style="text-align:center;margin-bottom:8px">
        <div style="font-size:16px;font-weight:bold">${activeBranch?.name || 'CafePOS'}</div>
        <div style="font-size:11px">${activeBranch?.address || ''}</div>
        ${activeBranch?.phone ? `<div style="font-size:11px">Tel: ${activeBranch.phone}</div>` : ''}
      </div>
      <div style="border-top:1px dashed #000;margin:6px 0"></div>
      <div style="font-size:11px">
        <div>Order #: ${order.order_number || order.id?.slice(-6).toUpperCase()}</div>
        <div>${date.toLocaleDateString()} ${date.toLocaleTimeString()}</div>
        <div>Payment: ${(order.payment_method||'').toUpperCase()}</div>
      </div>
      <div style="border-top:1px dashed #000;margin:6px 0"></div>
      ${(order.items||[]).map(i => `<div style="display:flex;justify-content:space-between;font-size:12px"><span>${i.name} x${i.qty}</span><span>₱${(i.price * i.qty).toFixed(2)}</span></div>`).join('')}
      <div style="border-top:1px dashed #000;margin:6px 0"></div>
      <div style="display:flex;justify-content:space-between;font-size:14px;font-weight:bold"><span>TOTAL</span><span>₱${parseFloat(order.total).toFixed(2)}</span></div>
      <div style="border-top:1px dashed #000;margin:6px 0"></div>
      <div style="text-align:center;font-size:11px">Thank you! ☕</div>
    `;
    window.print();
    el.style.display = 'none';
  };

  if (loading) return (
    <div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12}}>
      <div style={{fontSize:28}}>☕</div>
      <div style={{color:'var(--text2)',fontSize:14}}>Loading…</div>
    </div>
  );

  return (
    <div style={{height:'100%',display:'flex',flexDirection:'column',overflow:'hidden'}}>
      {/* Toast */}
      {toast && (
        <div style={{position:'fixed',top:16,left:'50%',transform:'translateX(-50%)',zIndex:1000,
          background: toast.type==='error' ? 'var(--red)' : 'var(--green)',
          color:'white',padding:'10px 20px',borderRadius:'var(--radius)',fontSize:14,fontWeight:500,
          boxShadow:'0 4px 20px rgba(0,0,0,0.4)'}}>
          {toast.msg}
        </div>
      )}

      {/* Top Nav */}
      <div style={{background:'var(--bg2)',borderBottom:'1px solid var(--border)',padding:'0 1rem',
        display:'flex',alignItems:'center',gap:0,flexShrink:0}}>
        <div style={{fontSize:18,fontWeight:700,marginRight:'1rem',letterSpacing:'-0.5px'}}>☕</div>

        {/* Branch Selector */}
        <div style={{position:'relative',marginRight:'1rem'}}>
          <button onClick={() => setBranchDropdownOpen(!branchDropdownOpen)}
            style={{display:'flex',alignItems:'center',gap:6,background:'var(--bg3)',border:'1px solid var(--border)',
              borderRadius:8,padding:'6px 12px',color:'var(--text)',fontSize:13,fontWeight:500}}>
            <span>📍 {activeBranch?.name || 'Select Branch'}</span>
            <span style={{fontSize:10,color:'var(--text3)'}}>▼</span>
          </button>
          {branchDropdownOpen && (
            <div style={{position:'absolute',top:'100%',left:0,marginTop:4,background:'var(--bg2)',border:'1px solid var(--border)',
              borderRadius:10,overflow:'hidden',zIndex:50,minWidth:200,boxShadow:'0 8px 30px rgba(0,0,0,0.5)'}}>
              {branches.map(b => (
                <button key={b.id} onClick={() => { setActiveBranch(b); setBranchDropdownOpen(false); setCart([]); setActiveCategory('all'); }}
                  style={{display:'block',width:'100%',textAlign:'left',padding:'10px 14px',
                    background: activeBranch?.id === b.id ? 'var(--amber-bg)' : 'transparent',
                    color: activeBranch?.id === b.id ? 'var(--amber)' : 'var(--text)',fontSize:13,
                    borderBottom:'1px solid var(--border)'}}>
                  📍 {b.name}
                  {b.address && <div style={{fontSize:11,color:'var(--text3)',marginTop:2}}>{b.address}</div>}
                </button>
              ))}
              <button onClick={() => { setBranchModalOpen(true); setBranchDropdownOpen(false); }}
                style={{display:'block',width:'100%',textAlign:'left',padding:'10px 14px',
                  background:'transparent',color:'var(--amber)',fontSize:13,fontWeight:500}}>
                + Add Branch
              </button>
            </div>
          )}
        </div>

        {[['pos','POS'],['dashboard','Dashboard'],['reports','Reports'],['products','Products'],['branches','Branches']].map(([id,label]) => (
          <button key={id} onClick={() => setTab(id)}
            style={{padding:'14px 14px',background:'none',color: tab===id ? 'var(--amber)' : 'var(--text2)',
              fontWeight: tab===id ? 600 : 400, fontSize:13,
              borderBottom: tab===id ? '2px solid var(--amber)' : '2px solid transparent',
              transition:'color 0.15s'}}>
            {label}
          </button>
        ))}
        <div style={{flex:1}} />
        <div style={{fontSize:12,color:'var(--text3)',fontFamily:'DM Mono'}}>
          {new Date().toLocaleDateString('en-PH',{weekday:'short',month:'short',day:'numeric'})}
        </div>
      </div>

      {/* No branch selected state */}
      {!activeBranch && (
        <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:12}}>
          <div style={{fontSize:48}}>📍</div>
          <div style={{color:'var(--text2)'}}>Create or select a branch to get started</div>
          <button onClick={() => setBranchModalOpen(true)} style={{background:'var(--amber)',color:'#1a0f00',padding:'10px 20px',borderRadius:8,fontWeight:600,fontSize:14}}>
            + Create Branch
          </button>
        </div>
      )}

      {/* POS Tab */}
      {activeBranch && tab === 'pos' && (
        <div style={{flex:1,display:'flex',overflow:'hidden'}}>
          {/* Left - Menu */}
          <div style={{flex:1,display:'flex',flexDirection:'column',overflow:'hidden',borderRight:'1px solid var(--border)'}}>
            <div style={{padding:'12px',borderBottom:'1px solid var(--border)',background:'var(--bg2)'}}>
              <div style={{position:'relative',marginBottom:10}}>
                <span style={{position:'absolute',left:12,top:'50%',transform:'translateY(-50%)',color:'var(--text3)',fontSize:16}}>🔍</span>
                <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search menu…"
                  style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:8,padding:'9px 12px 9px 36px',color:'var(--text)',fontSize:14}} />
              </div>
              <div style={{display:'flex',gap:8,overflowX:'auto',paddingBottom:2}}>
                <CatChip active={activeCategory==='all'} onClick={() => setActiveCategory('all')} label="All" />
                {categories.map(c => (
                  <CatChip key={c.id} active={activeCategory===c.id} onClick={() => setActiveCategory(c.id)} label={`${c.icon} ${c.name}`} />
                ))}
              </div>
            </div>
            <div style={{flex:1,overflowY:'auto',padding:'12px',
              display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(150px,1fr))',gap:10,alignContent:'start'}}>
              {filteredProducts.map(p => (
                <ProductCard key={p.id} product={p} onAdd={() => addToCart(p)} />
              ))}
              {filteredProducts.length === 0 && (
                <div style={{gridColumn:'1/-1',textAlign:'center',padding:'3rem',color:'var(--text3)'}}>
                  {products.length === 0 ? 'No products yet. Add some from the Products tab.' : 'No matching products'}
                </div>
              )}
            </div>
          </div>

          {/* Right - Cart */}
          <div style={{width:340,display:'flex',flexDirection:'column',background:'var(--bg2)'}}>
            <div style={{padding:'14px 16px',borderBottom:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div style={{fontWeight:600,fontSize:15}}>Current Order</div>
              {cart.length > 0 && (
                <button onClick={clearCart} style={{background:'var(--red-bg)',color:'var(--red)',padding:'4px 10px',borderRadius:6,fontSize:12}}>Clear</button>
              )}
            </div>
            <div style={{flex:1,overflowY:'auto',padding:'8px'}}>
              {cart.length === 0 && (
                <div style={{textAlign:'center',padding:'3rem 1rem',color:'var(--text3)'}}>
                  <div style={{fontSize:32,marginBottom:8}}>🛒</div>
                  Tap items to add
                </div>
              )}
              {cart.map(item => (
                <CartItem key={item.id} item={item} onUpdate={(d) => updateQty(item.id, d)} />
              ))}
            </div>
            <div style={{padding:'0 10px 8px'}}>
              <input value={note} onChange={e => setNote(e.target.value)} placeholder="Order note (optional)"
                style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 12px',color:'var(--text)',fontSize:13}} />
            </div>
            <div style={{padding:'10px 16px',borderTop:'1px solid var(--border)'}}>
              <Row label="Subtotal" value={`₱${subtotal.toFixed(2)}`} />
              <Row label="VAT (12%)" value={`₱${tax.toFixed(2)}`} muted />
              <div style={{display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:18,margin:'8px 0',color:'var(--amber)'}}>
                <span>Total</span><span>₱{total.toFixed(2)}</span>
              </div>
            </div>
            <div style={{padding:'0 10px 10px',display:'flex',gap:6}}>
              {[['cash','💵 Cash'],['card','💳 Card'],['gcash','📱 GCash'],['maya','🟢 Maya']].map(([k,l]) => (
                <button key={k} onClick={() => setPaymentMethod(k)}
                  style={{flex:1,padding:'7px 4px',borderRadius:8,fontSize:11,fontWeight:500,
                    background: paymentMethod===k ? 'var(--amber)' : 'var(--bg3)',
                    color: paymentMethod===k ? '#1a0f00' : 'var(--text2)',
                    border:`1px solid ${paymentMethod===k ? 'var(--amber)' : 'var(--border)'}`,transition:'all 0.15s'}}>
                  {l}
                </button>
              ))}
            </div>
            {paymentMethod === 'cash' && cart.length > 0 && (
              <div style={{padding:'0 10px 10px'}}>
                <input value={cashGiven} onChange={e => setCashGiven(e.target.value)} type="number" placeholder="Cash given"
                  style={{width:'100%',background:'var(--bg3)',border:'1px solid var(--border)',borderRadius:8,padding:'8px 12px',color:'var(--text)',fontSize:14}} />
                {cashGiven && parseFloat(cashGiven) >= total && (
                  <div style={{fontSize:13,color:'var(--green)',marginTop:6,fontWeight:500}}>
                    Change: ₱{(parseFloat(cashGiven) - total).toFixed(2)}
                  </div>
                )}
              </div>
            )}
            <div style={{padding:'0 10px 14px'}}>
              <button onClick={processOrder} disabled={cart.length === 0}
                style={{width:'100%',padding:'14px',background: cart.length > 0 ? 'var(--amber)' : 'var(--bg4)',
                  color: cart.length > 0 ? '#1a0f00' : 'var(--text3)',
                  borderRadius:10,fontWeight:700,fontSize:16,opacity: cart.length > 0 ? 1 : 0.5}}>
                {cart.length > 0 ? `Charge ₱${total.toFixed(2)}` : 'Add items to order'}
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Dashboard Tab - Cash on Hand */}
      {activeBranch && tab === 'dashboard' && (
        <DashboardTab
          db={db}
          branch={activeBranch}
          orders={orders}
          todayOrders={todayOrders}
          todayRevenue={todayRevenue}
          todayCashSales={todayCashSales}
          cashRegister={cashRegister}
          setCashRegister={setCashRegister}
          showToast={showToast}
        />
      )}

      {/* Reports Tab */}
      {activeBranch && tab === 'reports' && (
        <ReportsTab orders={orders} todayOrders={todayOrders} todayRevenue={todayRevenue} printReceipt={printReceipt} />
      )}

      {/* Products Tab */}
      {activeBranch && tab === 'products' && (
        <ProductsManager db={db} branch={activeBranch} categories={categories} products={products} onRefresh={loadBranchData} showToast={showToast} />
      )}

      {/* Branches Tab */}
      {tab === 'branches' && (
        <BranchesManager db={db} branches={branches} activeBranch={activeBranch} onRefresh={loadBranches} onSelect={(b) => { setActiveBranch(b); setTab('pos'); }} showToast={showToast} />
      )}

      {/* Receipt Modal */}
      {receiptOpen && lastOrder && (
        <Modal onClose={() => setReceiptOpen(false)}>
          <div style={{textAlign:'center',marginBottom:'1.5rem'}}>
            <div style={{fontSize:48,marginBottom:8}}>✅</div>
            <div style={{fontSize:20,fontWeight:700}}>Order Complete</div>
            <div style={{color:'var(--text2)',fontSize:14}}>#{lastOrder.order_number || lastOrder.id?.slice(-6).toUpperCase()}</div>
          </div>
          <div style={{background:'var(--bg3)',borderRadius:10,padding:'1rem',marginBottom:'1rem',fontSize:14}}>
            {lastOrder.items?.map(i => (
              <div key={i.id} style={{display:'flex',justifyContent:'space-between',padding:'4px 0',color:'var(--text2)'}}>
                <span>{i.name} × {i.qty}</span><span>₱{(i.price*i.qty).toFixed(2)}</span>
              </div>
            ))}
            <div style={{borderTop:'1px solid var(--border)',marginTop:8,paddingTop:8}}>
              <div style={{display:'flex',justifyContent:'space-between',fontWeight:700,fontSize:16,color:'var(--amber)'}}>
                <span>Total</span><span>₱{parseFloat(lastOrder.total).toFixed(2)}</span>
              </div>
              {lastOrder.change > 0 && (
                <div style={{display:'flex',justifyContent:'space-between',color:'var(--green)',fontWeight:500,marginTop:4}}>
                  <span>Change</span><span>₱{parseFloat(lastOrder.change).toFixed(2)}</span>
                </div>
              )}
            </div>
          </div>
          <div style={{display:'flex',gap:10}}>
            <button onClick={() => printReceipt(lastOrder)}
              style={{flex:1,padding:'12px',background:'var(--bg3)',border:'1px solid var(--border2)',color:'var(--text)',borderRadius:10,fontWeight:500,fontSize:14}}>
              🖨 Print
            </button>
            <button onClick={() => setReceiptOpen(false)}
              style={{flex:1,padding:'12px',background:'var(--amber)',color:'#1a0f00',borderRadius:10,fontWeight:700,fontSize:14}}>
              New Order
            </button>
          </div>
        </Modal>
      )}

      {/* Branch Create Modal */}
      {branchModalOpen && (
        <BranchCreateModal db={db} onClose={() => setBranchModalOpen(false)} onCreated={(b) => {
          setBranches(prev => [...prev, b]);
          setActiveBranch(b);
          setBranchModalOpen(false);
          showToast('Branch created!');
        }} />
      )}
    </div>
  );
}

// ── Dashboard Tab ────────────────────────────────────────────────────────────
function DashboardTab({ db, branch, orders, todayOrders, todayRevenue, todayCashSales, cashRegister, setCashRegister, showToast }) {
  const [editingOpening, setEditingOpening] = useState(false);
  const [openingVal, setOpeningVal] = useState('');
  const [adjAmount, setAdjAmount] = useState('');
  const [adjNote, setAdjNote] = useState('');
  const [saving, setSaving] = useState(false);
  const [editIdx, setEditIdx] = useState(null);
  const [editAdjAmt, setEditAdjAmt] = useState('');
  const [editAdjNote, setEditAdjNote] = useState('');

  const openingCash = cashRegister ? parseFloat(cashRegister.opening_cash || 0) : 0;
  const adjustments = cashRegister?.adjustments || [];
  const totalAdjustments = adjustments.reduce((s, a) => s + parseFloat(a.amount || 0), 0);
  const cashOnHand = openingCash + todayCashSales + totalAdjustments;

  const paymentBreakdown = useMemo(() => {
    const map = {};
    todayOrders.forEach(o => { map[o.payment_method] = (map[o.payment_method] || 0) + parseFloat(o.total); });
    return map;
  }, [todayOrders]);

  const saveOpening = async () => {
    if (!cashRegister) return;
    setSaving(true);
    const { error } = await db.from('pos_cash_register').update({ opening_cash: parseFloat(openingVal || 0) }).eq('id', cashRegister.id);
    if (!error) { setCashRegister(r => ({...r, opening_cash: parseFloat(openingVal || 0)})); setEditingOpening(false); showToast('Opening cash updated'); }
    else showToast('Error saving','error');
    setSaving(false);
  };

  const addAdjustment = async () => {
    if (!adjAmount || !cashRegister) return;
    setSaving(true);
    const newAdj = [...adjustments, { amount: parseFloat(adjAmount), note: adjNote || 'Adjustment', time: new Date().toISOString() }];
    const { error } = await db.from('pos_cash_register').update({ adjustments: newAdj }).eq('id', cashRegister.id);
    if (!error) { setCashRegister(r => ({...r, adjustments: newAdj})); setAdjAmount(''); setAdjNote(''); showToast('Adjustment added'); }
    else showToast('Error','error');
    setSaving(false);
  };

  const saveEditAdj = async () => {
    if (editIdx === null || !cashRegister) return;
    setSaving(true);
    const newAdj = [...adjustments];
    newAdj[editIdx] = { ...newAdj[editIdx], amount: parseFloat(editAdjAmt), note: editAdjNote || 'Adjustment' };
    const { error } = await db.from('pos_cash_register').update({ adjustments: newAdj }).eq('id', cashRegister.id);
    if (!error) { setCashRegister(r => ({...r, adjustments: newAdj})); setEditIdx(null); showToast('Updated'); }
    else showToast('Error','error');
    setSaving(false);
  };

  const deleteAdj = async (idx) => {
    if (!cashRegister) return;
    const newAdj = adjustments.filter((_, i) => i !== idx);
    const { error } = await db.from('pos_cash_register').update({ adjustments: newAdj }).eq('id', cashRegister.id);
    if (!error) { setCashRegister(r => ({...r, adjustments: newAdj})); showToast('Removed'); }
  };

  return (
    <div style={{flex:1,overflowY:'auto',padding:'1.5rem'}}>
      <div style={{marginBottom:'1.5rem'}}>
        <h2 style={{fontSize:20,fontWeight:700,marginBottom:4}}>📊 Daily Dashboard — {branch.name}</h2>
        <div style={{color:'var(--text3)',fontSize:13}}>{new Date().toLocaleDateString('en-PH',{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</div>
      </div>

      {/* Cash on Hand - Main Card */}
      <div style={{background:'linear-gradient(135deg, #2a1f00 0%, #1a1a1a 100%)',border:'1px solid var(--amber2)',borderRadius:'var(--radius)',padding:'1.5rem',marginBottom:'1.5rem'}}>
        <div style={{fontSize:13,color:'var(--text2)',marginBottom:4}}>💰 Cash on Hand (Current)</div>
        <div style={{fontSize:36,fontWeight:700,color:'var(--amber)',marginBottom:12}}>₱{cashOnHand.toFixed(2)}</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:12}}>
          <div style={{background:'rgba(0,0,0,0.3)',borderRadius:8,padding:'10px'}}>
            <div style={{fontSize:11,color:'var(--text3)'}}>Opening</div>
            <div style={{fontSize:16,fontWeight:600,color:'var(--text)'}}>₱{openingCash.toFixed(2)}</div>
          </div>
          <div style={{background:'rgba(0,0,0,0.3)',borderRadius:8,padding:'10px'}}>
            <div style={{fontSize:11,color:'var(--text3)'}}>Cash Sales</div>
            <div style={{fontSize:16,fontWeight:600,color:'var(--green)'}}>+₱{todayCashSales.toFixed(2)}</div>
          </div>
          <div style={{background:'rgba(0,0,0,0.3)',borderRadius:8,padding:'10px'}}>
            <div style={{fontSize:11,color:'var(--text3)'}}>Adjustments</div>
            <div style={{fontSize:16,fontWeight:600,color: totalAdjustments >= 0 ? 'var(--blue)' : 'var(--red)'}}>
              {totalAdjustments >= 0 ? '+' : ''}₱{totalAdjustments.toFixed(2)}
            </div>
          </div>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1.5rem'}}>
        {/* Left Column */}
        <div>
          {/* Opening Cash */}
          <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'1.25rem',marginBottom:'1rem'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'0.75rem'}}>
              <div style={{fontWeight:600,fontSize:14}}>Opening Cash</div>
              {!editingOpening && (
                <button onClick={() => { setEditingOpening(true); setOpeningVal(String(openingCash)); }}
                  style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'4px 10px',borderRadius:6,fontSize:12}}>
                  Edit
                </button>
              )}
            </div>
            {editingOpening ? (
              <div style={{display:'flex',gap:8}}>
                <input value={openingVal} onChange={e => setOpeningVal(e.target.value)} type="number" placeholder="0.00"
                  style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:8,padding:'8px 12px',color:'var(--text)',fontSize:14}} />
                <button onClick={saveOpening} disabled={saving}
                  style={{background:'var(--amber)',color:'#1a0f00',padding:'8px 14px',borderRadius:8,fontWeight:600,fontSize:13}}>Save</button>
                <button onClick={() => setEditingOpening(false)}
                  style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'8px 14px',borderRadius:8,fontSize:13}}>✕</button>
              </div>
            ) : (
              <div style={{fontSize:24,fontWeight:700}}>₱{openingCash.toFixed(2)}</div>
            )}
          </div>

          {/* Add Adjustment */}
          <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'1.25rem',marginBottom:'1rem'}}>
            <div style={{fontWeight:600,fontSize:14,marginBottom:'0.75rem'}}>Add Cash Adjustment</div>
            <div style={{fontSize:12,color:'var(--text3)',marginBottom:10}}>Use negative values for withdrawals (e.g., -500)</div>
            <div style={{display:'flex',gap:8,marginBottom:8}}>
              <input value={adjAmount} onChange={e => setAdjAmount(e.target.value)} type="number" placeholder="Amount (₱)"
                style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:8,padding:'8px 12px',color:'var(--text)',fontSize:14}} />
              <input value={adjNote} onChange={e => setAdjNote(e.target.value)} placeholder="Note"
                style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:8,padding:'8px 12px',color:'var(--text)',fontSize:14}} />
            </div>
            <button onClick={addAdjustment} disabled={!adjAmount || saving}
              style={{width:'100%',padding:'10px',background:'var(--blue)',color:'white',borderRadius:8,fontWeight:600,fontSize:13,opacity: adjAmount ? 1 : 0.5}}>
              Add Adjustment
            </button>
          </div>

          {/* Payment Breakdown */}
          <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'1.25rem'}}>
            <div style={{fontWeight:600,fontSize:14,marginBottom:'0.75rem'}}>Today's Payment Breakdown</div>
            {Object.entries(paymentBreakdown).length === 0 && <div style={{color:'var(--text3)',fontSize:13}}>No orders yet today</div>}
            {Object.entries(paymentBreakdown).map(([method, amount]) => (
              <div key={method} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
                <span style={{fontSize:13,textTransform:'capitalize',color:'var(--text2)'}}>{method}</span>
                <span style={{fontSize:14,fontWeight:600}}>₱{amount.toFixed(2)}</span>
              </div>
            ))}
            <div style={{display:'flex',justifyContent:'space-between',padding:'10px 0 0',fontWeight:700,color:'var(--amber)'}}>
              <span>Total Revenue</span><span>₱{todayRevenue.toFixed(2)}</span>
            </div>
          </div>
        </div>

        {/* Right Column - Adjustments List */}
        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',overflow:'hidden'}}>
          <div style={{padding:'14px 16px',borderBottom:'1px solid var(--border)',fontWeight:600,fontSize:14}}>
            Cash Adjustments ({adjustments.length})
          </div>
          <div style={{maxHeight:500,overflowY:'auto'}}>
            {adjustments.length === 0 && (
              <div style={{textAlign:'center',padding:'2rem',color:'var(--text3)',fontSize:13}}>No adjustments today</div>
            )}
            {adjustments.map((adj, idx) => (
              <div key={idx} style={{padding:'10px 14px',borderBottom:'1px solid var(--border)'}}>
                {editIdx === idx ? (
                  <div>
                    <div style={{display:'flex',gap:8,marginBottom:8}}>
                      <input value={editAdjAmt} onChange={e => setEditAdjAmt(e.target.value)} type="number"
                        style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:6,padding:'6px 10px',color:'var(--text)',fontSize:13}} />
                      <input value={editAdjNote} onChange={e => setEditAdjNote(e.target.value)}
                        style={{flex:1,background:'var(--bg3)',border:'1px solid var(--border2)',borderRadius:6,padding:'6px 10px',color:'var(--text)',fontSize:13}} />
                    </div>
                    <div style={{display:'flex',gap:6}}>
                      <button onClick={saveEditAdj} style={{background:'var(--amber)',color:'#1a0f00',padding:'4px 12px',borderRadius:6,fontSize:12,fontWeight:600}}>Save</button>
                      <button onClick={() => setEditIdx(null)} style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'4px 12px',borderRadius:6,fontSize:12}}>Cancel</button>
                    </div>
                  </div>
                ) : (
                  <div style={{display:'flex',alignItems:'center',gap:10}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:13,fontWeight:500,color: parseFloat(adj.amount) >= 0 ? 'var(--green)' : 'var(--red)'}}>
                        {parseFloat(adj.amount) >= 0 ? '+' : ''}₱{parseFloat(adj.amount).toFixed(2)}
                      </div>
                      <div style={{fontSize:12,color:'var(--text3)'}}>{adj.note} · {adj.time ? new Date(adj.time).toLocaleTimeString('en-PH',{hour:'2-digit',minute:'2-digit'}) : ''}</div>
                    </div>
                    <button onClick={() => { setEditIdx(idx); setEditAdjAmt(String(adj.amount)); setEditAdjNote(adj.note || ''); }}
                      style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'3px 8px',borderRadius:6,fontSize:11}}>Edit</button>
                    <button onClick={() => deleteAdj(idx)}
                      style={{background:'var(--red-bg)',border:'1px solid var(--red)',color:'var(--red)',padding:'3px 8px',borderRadius:6,fontSize:11}}>✕</button>
                  </div>
                )}
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ── Reports Tab ──────────────────────────────────────────────────────────────
function ReportsTab({ orders, todayOrders, todayRevenue, printReceipt }) {
  const totalRevenue = orders.reduce((s, o) => s + parseFloat(o.total), 0);
  const paymentBreakdown = useMemo(() => {
    const map = {};
    orders.forEach(o => { map[o.payment_method] = (map[o.payment_method] || 0) + parseFloat(o.total); });
    return map;
  }, [orders]);

  return (
    <div style={{flex:1,overflowY:'auto',padding:'1.5rem'}}>
      <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(180px,1fr))',gap:12,marginBottom:'1.5rem'}}>
        <StatCard label="Today's Revenue" value={`₱${todayRevenue.toFixed(2)}`} sub={`${todayOrders.length} orders`} color="var(--amber)" />
        <StatCard label="All-Time Revenue" value={`₱${totalRevenue.toFixed(2)}`} sub={`${orders.length} total orders`} color="var(--green)" />
        {Object.entries(paymentBreakdown).map(([method, total]) => (
          <StatCard key={method} label={method.charAt(0).toUpperCase()+method.slice(1)} value={`₱${total.toFixed(2)}`} sub="payment method" color="var(--blue)" />
        ))}
      </div>

      <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',overflow:'hidden'}}>
        <div style={{padding:'14px 16px',borderBottom:'1px solid var(--border)',fontWeight:600,fontSize:14}}>Recent Orders</div>
        <div style={{overflowX:'auto'}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
            <thead>
              <tr style={{background:'var(--bg3)'}}>
                {['#','Date','Items','Payment','Total',''].map(h => (
                  <th key={h} style={{padding:'10px 14px',textAlign:'left',color:'var(--text2)',fontWeight:500,fontSize:12}}>{h}</th>
                ))}
              </tr>
            </thead>
            <tbody>
              {orders.slice(0,50).map((o,i) => (
                <tr key={o.id} style={{borderTop:'1px solid var(--border)'}}>
                  <td style={{padding:'10px 14px',fontFamily:'DM Mono',fontSize:12,color:'var(--text3)'}}>#{o.order_number || o.id.slice(-6)}</td>
                  <td style={{padding:'10px 14px',color:'var(--text2)',whiteSpace:'nowrap'}}>{new Date(o.created_at).toLocaleString('en-PH',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'})}</td>
                  <td style={{padding:'10px 14px',color:'var(--text2)'}}>{Array.isArray(o.items) ? o.items.reduce((s,i)=>s+i.qty,0) : '—'} items</td>
                  <td style={{padding:'10px 14px'}}><span style={{background:'var(--bg3)',border:'1px solid var(--border)',padding:'2px 8px',borderRadius:6,fontSize:11,textTransform:'capitalize'}}>{o.payment_method}</span></td>
                  <td style={{padding:'10px 14px',fontWeight:600,color:'var(--amber)'}}>₱{parseFloat(o.total).toFixed(2)}</td>
                  <td style={{padding:'10px 14px'}}>
                    <button onClick={() => printReceipt(o)} style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'4px 10px',borderRadius:6,fontSize:11}}>🖨</button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  );
}

// ── Products Manager ─────────────────────────────────────────────────────────
function ProductsManager({ db, branch, categories, products, onRefresh, showToast }) {
  const [form, setForm] = useState({ name:'', price:'', category_id:'', available:true });
  const [editing, setEditing] = useState(null);
  const [saving, setSaving] = useState(false);
  const [catForm, setCatForm] = useState({ name:'', icon:'☕' });
  const [showCatForm, setShowCatForm] = useState(false);
  const [deleteConfirm, setDeleteConfirm] = useState(null);

  const save = async () => {
    if (!form.name || !form.price) { showToast('Name and price required','error'); return; }
    setSaving(true);
    const data = { name: form.name, price: parseFloat(form.price), category_id: form.category_id || null, available: form.available, branch_id: branch.id };
    const op = editing
      ? db.from('pos_products').update(data).eq('id', editing)
      : db.from('pos_products').insert(data);
    const { error } = await op;
    if (error) showToast('Error saving','error');
    else { showToast(editing ? 'Updated' : 'Added'); setForm({name:'',price:'',category_id:'',available:true}); setEditing(null); onRefresh(); }
    setSaving(false);
  };

  const toggle = async (p) => {
    await db.from('pos_products').update({ available: !p.available }).eq('id', p.id);
    onRefresh();
  };

  const del = async (id) => {
    await db.from('pos_products').delete().eq('id', id);
    setDeleteConfirm(null); onRefresh(); showToast('Deleted');
  };

  const saveCategory = async () => {
    if (!catForm.name) return;
    await db.from('pos_categories').insert({ name: catForm.name, icon: catForm.icon, sort_order: categories.length+1, branch_id: branch.id });
    setCatForm({name:'',icon:'☕'}); setShowCatForm(false); onRefresh();
  };

  return (
    <div style={{flex:1,overflowY:'auto',padding:'1.5rem',display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1.5rem',alignItems:'start'}}>
      <div>
        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'1.25rem',marginBottom:'1rem'}}>
          <div style={{fontWeight:600,marginBottom:'1rem',fontSize:15}}>{editing ? 'Edit Product' : 'Add Product'}</div>
          <Field label="Name"><input value={form.name} onChange={e => setForm(f=>({...f,name:e.target.value}))} placeholder="e.g. Latte" style={inputStyle} /></Field>
          <Field label="Price (₱)"><input value={form.price} onChange={e => setForm(f=>({...f,price:e.target.value}))} type="number" placeholder="0.00" style={inputStyle} /></Field>
          <Field label="Category">
            <select value={form.category_id} onChange={e => setForm(f=>({...f,category_id:e.target.value}))} style={inputStyle}>
              <option value="">No category</option>
              {categories.map(c => <option key={c.id} value={c.id}>{c.icon} {c.name}</option>)}
            </select>
          </Field>
          <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:'1rem'}}>
            <input type="checkbox" checked={form.available} onChange={e => setForm(f=>({...f,available:e.target.checked}))} id="avail" />
            <label htmlFor="avail" style={{fontSize:13,color:'var(--text2)',cursor:'pointer'}}>Available for sale</label>
          </div>
          <div style={{display:'flex',gap:8}}>
            {editing && <button onClick={() => { setEditing(null); setForm({name:'',price:'',category_id:'',available:true}); }}
              style={{flex:1,padding:'10px',background:'var(--bg3)',border:'1px solid var(--border2)',color:'var(--text2)',borderRadius:8,fontSize:13}}>Cancel</button>}
            <button onClick={save} disabled={saving}
              style={{flex:2,padding:'10px',background:'var(--amber)',color:'#1a0f00',borderRadius:8,fontWeight:600,fontSize:14}}>
              {saving ? 'Saving…' : editing ? 'Update' : 'Add Product'}
            </button>
          </div>
        </div>

        <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'1.25rem'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>
            <div style={{fontWeight:600,fontSize:15}}>Categories</div>
            <button onClick={() => setShowCatForm(!showCatForm)} style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'4px 12px',borderRadius:6,fontSize:12}}>
              {showCatForm ? 'Cancel' : '+ Add'}
            </button>
          </div>
          {showCatForm && (
            <div style={{display:'flex',gap:8,marginBottom:'1rem'}}>
              <input value={catForm.icon} onChange={e => setCatForm(f=>({...f,icon:e.target.value}))} placeholder="🍵"
                style={{...inputStyle,width:48,textAlign:'center',padding:'8px 4px'}} />
              <input value={catForm.name} onChange={e => setCatForm(f=>({...f,name:e.target.value}))} placeholder="Category name"
                style={{...inputStyle,flex:1}} />
              <button onClick={saveCategory} style={{background:'var(--amber)',color:'#1a0f00',padding:'8px 12px',borderRadius:8,fontWeight:600,fontSize:13}}>Add</button>
            </div>
          )}
          <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
            {categories.map(c => (
              <span key={c.id} style={{background:'var(--bg3)',border:'1px solid var(--border)',padding:'5px 12px',borderRadius:20,fontSize:13}}>{c.icon} {c.name}</span>
            ))}
            {categories.length === 0 && <div style={{color:'var(--text3)',fontSize:13}}>No categories yet</div>}
          </div>
        </div>
      </div>

      <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',overflow:'hidden'}}>
        <div style={{padding:'12px 16px',borderBottom:'1px solid var(--border)',fontWeight:600,fontSize:14}}>Products ({products.length})</div>
        <div style={{maxHeight:600,overflowY:'auto'}}>
          {products.map(p => {
            const cat = categories.find(c => c.id === p.category_id);
            return (
              <div key={p.id} style={{display:'flex',alignItems:'center',gap:10,padding:'10px 14px',borderBottom:'1px solid var(--border)',opacity: p.available ? 1 : 0.5}}>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.name}</div>
                  <div style={{fontSize:12,color:'var(--text3)'}}>{cat ? `${cat.icon} ${cat.name}` : 'No category'} · ₱{parseFloat(p.price).toFixed(2)}</div>
                </div>
                <button onClick={() => toggle(p)} style={{background: p.available ? 'var(--green-bg)' : 'var(--bg3)', color: p.available ? 'var(--green)' : 'var(--text3)',
                  padding:'3px 8px',borderRadius:6,fontSize:11,border:`1px solid ${p.available ? 'var(--green)' : 'var(--border)'}`,fontWeight:500}}>
                  {p.available ? 'On' : 'Off'}
                </button>
                <button onClick={() => { setEditing(p.id); setForm({name:p.name,price:String(p.price),category_id:p.category_id||'',available:p.available}); }}
                  style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'4px 8px',borderRadius:6,fontSize:11}}>Edit</button>
                {deleteConfirm === p.id ? (
                  <div style={{display:'flex',gap:4}}>
                    <button onClick={() => del(p.id)} style={{background:'var(--red)',color:'white',padding:'4px 8px',borderRadius:6,fontSize:11}}>Yes</button>
                    <button onClick={() => setDeleteConfirm(null)} style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'4px 8px',borderRadius:6,fontSize:11}}>No</button>
                  </div>
                ) : (
                  <button onClick={() => setDeleteConfirm(p.id)} style={{background:'var(--red-bg)',border:'1px solid var(--red)',color:'var(--red)',padding:'4px 8px',borderRadius:6,fontSize:11}}>✕</button>
                )}
              </div>
            );
          })}
          {products.length === 0 && <div style={{textAlign:'center',padding:'2rem',color:'var(--text3)',fontSize:14}}>No products yet</div>}
        </div>
      </div>
    </div>
  );
}

// ── Branches Manager ─────────────────────────────────────────────────────────
function BranchesManager({ db, branches, activeBranch, onRefresh, onSelect, showToast }) {
  const [editId, setEditId] = useState(null);
  const [editForm, setEditForm] = useState({ name:'', address:'', phone:'' });
  const [saving, setSaving] = useState(false);
  const [deleteConfirm, setDeleteConfirm] = useState(null);

  const saveEdit = async () => {
    if (!editForm.name) { showToast('Name required','error'); return; }
    setSaving(true);
    const { error } = await db.from('pos_branches').update({ name: editForm.name, address: editForm.address || null, phone: editForm.phone || null }).eq('id', editId);
    if (!error) { showToast('Branch updated'); setEditId(null); onRefresh(); }
    else showToast('Error','error');
    setSaving(false);
  };

  const deleteBranch = async (id) => {
    await db.from('pos_branches').delete().eq('id', id);
    setDeleteConfirm(null); onRefresh(); showToast('Branch deleted');
  };

  return (
    <div style={{flex:1,overflowY:'auto',padding:'1.5rem',maxWidth:700}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.5rem'}}>
        <h2 style={{fontSize:20,fontWeight:700}}>📍 Branch Management</h2>
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:12}}>
        {branches.map(b => (
          <div key={b.id} style={{background:'var(--bg2)',border: activeBranch?.id === b.id ? '1px solid var(--amber)' : '1px solid var(--border)',
            borderRadius:'var(--radius)',padding:'1.25rem'}}>
            {editId === b.id ? (
              <div>
                <Field label="Branch Name"><input value={editForm.name} onChange={e => setEditForm(f=>({...f,name:e.target.value}))} style={inputStyle} /></Field>
                <Field label="Address"><input value={editForm.address} onChange={e => setEditForm(f=>({...f,address:e.target.value}))} style={inputStyle} /></Field>
                <Field label="Phone"><input value={editForm.phone} onChange={e => setEditForm(f=>({...f,phone:e.target.value}))} style={inputStyle} /></Field>
                <div style={{display:'flex',gap:8}}>
                  <button onClick={saveEdit} disabled={saving} style={{background:'var(--amber)',color:'#1a0f00',padding:'8px 16px',borderRadius:8,fontWeight:600,fontSize:13}}>Save</button>
                  <button onClick={() => setEditId(null)} style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'8px 16px',borderRadius:8,fontSize:13}}>Cancel</button>
                </div>
              </div>
            ) : (
              <div style={{display:'flex',alignItems:'center',gap:12}}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,fontSize:15}}>{b.name} {activeBranch?.id === b.id && <span style={{fontSize:11,color:'var(--amber)',marginLeft:6}}>● Active</span>}</div>
                  {b.address && <div style={{fontSize:13,color:'var(--text2)',marginTop:2}}>{b.address}</div>}
                  {b.phone && <div style={{fontSize:12,color:'var(--text3)',marginTop:2}}>{b.phone}</div>}
                </div>
                <button onClick={() => onSelect(b)} style={{background:'var(--amber-bg)',border:'1px solid var(--amber)',color:'var(--amber)',padding:'6px 14px',borderRadius:8,fontSize:12,fontWeight:500}}>
                  Select
                </button>
                <button onClick={() => { setEditId(b.id); setEditForm({name:b.name,address:b.address||'',phone:b.phone||''}); }}
                  style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'6px 12px',borderRadius:8,fontSize:12}}>Edit</button>
                {deleteConfirm === b.id ? (
                  <div style={{display:'flex',gap:4}}>
                    <button onClick={() => deleteBranch(b.id)} style={{background:'var(--red)',color:'white',padding:'6px 10px',borderRadius:8,fontSize:12}}>Confirm</button>
                    <button onClick={() => setDeleteConfirm(null)} style={{background:'var(--bg3)',border:'1px solid var(--border)',color:'var(--text2)',padding:'6px 10px',borderRadius:8,fontSize:12}}>No</button>
                  </div>
                ) : (
                  <button onClick={() => setDeleteConfirm(b.id)} style={{background:'var(--red-bg)',border:'1px solid var(--red)',color:'var(--red)',padding:'6px 12px',borderRadius:8,fontSize:12}}>Delete</button>
                )}
              </div>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

// ── Branch Create Modal ──────────────────────────────────────────────────────
function BranchCreateModal({ db, onClose, onCreated }) {
  const [form, setForm] = useState({ name:'', address:'', phone:'' });
  const [saving, setSaving] = useState(false);

  const save = async (e) => {
    e.preventDefault();
    if (!form.name) return;
    setSaving(true);
    const { data, error } = await db.from('pos_branches').insert({ name: form.name, address: form.address || null, phone: form.phone || null }).select().single();
    if (data) onCreated(data);
    setSaving(false);
  };

  return (
    <Modal onClose={onClose}>
      <div style={{fontSize:18,fontWeight:700,marginBottom:'1rem'}}>📍 Create New Branch</div>
      <form onSubmit={save}>
        <Field label="Branch Name *"><input value={form.name} onChange={e => setForm(f=>({...f,name:e.target.value}))} placeholder="e.g. Main St. Branch" style={inputStyle} required /></Field>
        <Field label="Address"><input value={form.address} onChange={e => setForm(f=>({...f,address:e.target.value}))} placeholder="123 Main Street" style={inputStyle} /></Field>
        <Field label="Phone"><input value={form.phone} onChange={e => setForm(f=>({...f,phone:e.target.value}))} placeholder="+63 912 345 6789" style={inputStyle} /></Field>
        <button type="submit" disabled={saving || !form.name}
          style={{width:'100%',padding:'12px',background:'var(--amber)',color:'#1a0f00',borderRadius:8,fontWeight:700,fontSize:15,marginTop:8,opacity: form.name ? 1 : 0.5}}>
          {saving ? 'Creating…' : 'Create Branch'}
        </button>
      </form>
    </Modal>
  );
}

// ── Shared Components ────────────────────────────────────────────────────────
function CatChip({ active, onClick, label }) {
  return (
    <button onClick={onClick} style={{whiteSpace:'nowrap',padding:'6px 14px',borderRadius:20,fontSize:13,fontWeight: active ? 600 : 400,
      background: active ? 'var(--amber)' : 'var(--bg3)',color: active ? '#1a0f00' : 'var(--text2)',
      border: `1px solid ${active ? 'var(--amber)' : 'var(--border)'}`,transition:'all 0.15s'}}>{label}</button>
  );
}

function ProductCard({ product, onAdd }) {
  const [pressed, setPressed] = useState(false);
  return (
    <button onPointerDown={() => setPressed(true)} onPointerUp={() => setPressed(false)} onPointerLeave={() => setPressed(false)}
      onClick={onAdd} style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',
        padding:'14px 12px',textAlign:'left',cursor:'pointer',transform: pressed ? 'scale(0.97)' : 'scale(1)',
        transition:'transform 0.1s',display:'flex',flexDirection:'column',gap:6}}>
      <div style={{fontSize:13,fontWeight:500,color:'var(--text)',lineHeight:1.3}}>{product.name}</div>
      <div style={{fontSize:15,fontWeight:700,color:'var(--amber)'}}>₱{parseFloat(product.price).toFixed(2)}</div>
    </button>
  );
}

function CartItem({ item, onUpdate }) {
  return (
    <div style={{display:'flex',alignItems:'center',gap:8,padding:'8px 10px',background:'var(--bg3)',borderRadius:10,marginBottom:6}}>
      <div style={{flex:1,minWidth:0}}>
        <div style={{fontSize:13,fontWeight:500,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{item.name}</div>
        <div style={{fontSize:12,color:'var(--text2)'}}>₱{item.price.toFixed(2)} each</div>
      </div>
      <div style={{display:'flex',alignItems:'center',gap:6}}>
        <button onClick={() => onUpdate(-1)} style={{width:26,height:26,borderRadius:6,background:'var(--bg4)',color:'var(--text2)',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>−</button>
        <span style={{fontSize:14,fontWeight:600,minWidth:16,textAlign:'center'}}>{item.qty}</span>
        <button onClick={() => onUpdate(1)} style={{width:26,height:26,borderRadius:6,background:'var(--amber)',color:'#1a0f00',fontSize:16,display:'flex',alignItems:'center',justifyContent:'center'}}>+</button>
      </div>
      <div style={{fontSize:13,fontWeight:600,color:'var(--amber)',minWidth:56,textAlign:'right'}}>₱{(item.price * item.qty).toFixed(2)}</div>
    </div>
  );
}

function Row({ label, value, muted }) {
  return (
    <div style={{display:'flex',justifyContent:'space-between',fontSize:13,color: muted ? 'var(--text3)' : 'var(--text2)',marginBottom:4}}>
      <span>{label}</span><span>{value}</span>
    </div>
  );
}

function StatCard({ label, value, sub, color }) {
  return (
    <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:'var(--radius)',padding:'1rem 1.25rem'}}>
      <div style={{fontSize:12,color:'var(--text3)',marginBottom:4}}>{label}</div>
      <div style={{fontSize:22,fontWeight:700,color: color || 'var(--text)',marginBottom:2}}>{value}</div>
      <div style={{fontSize:12,color:'var(--text3)'}}>{sub}</div>
    </div>
  );
}

function Modal({ children, onClose }) {
  return (
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.7)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:100,padding:'1rem'}} onClick={onClose}>
      <div style={{background:'var(--bg2)',border:'1px solid var(--border)',borderRadius:16,padding:'1.5rem',width:'100%',maxWidth:420,maxHeight:'90%',overflowY:'auto'}} onClick={e => e.stopPropagation()}>
        {children}
      </div>
    </div>
  );
}

function Field({ label, children }) {
  return (
    <div style={{marginBottom:'0.75rem'}}>
      <label style={{display:'block',fontSize:12,color:'var(--text2)',marginBottom:4}}>{label}</label>
      {children}
    </div>
  );
}

const inputStyle = {
  width:'100%', background:'var(--bg3)', border:'1px solid var(--border2)',
  borderRadius:8, padding:'9px 12px', color:'var(--text)', fontSize:14
};

// ── Root ─────────────────────────────────────────────────────────────────────
function App() {
  const [sbUrl, setSbUrl] = useState(localStorage.getItem('sb_url') || '');
  const [sbKey, setSbKey] = useState(localStorage.getItem('sb_key') || '');
  const [connected, setConnected] = useState(false);

  useEffect(() => { if (sbUrl && sbKey) setConnected(true); }, []);

  if (!connected) return <ConfigScreen onConnect={(url, key) => { setSbUrl(url); setSbKey(key); setConnected(true); }} />;
  return <POSApp supabaseUrl={sbUrl} supabaseKey={sbKey} />;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
